      document.getElementById('backToWeeks').addEventListener('click', () => {
        state.programView = 'weeks';
        renderProgram();
      });

      document.querySelectorAll('.session-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedDayIndex = parseInt(btn.dataset.day);
          state.programView = 'session';
          renderProgram();
        });
      });
    }

    async function renderSessionLogger() {
      // Clear stale session-local globals from any previous session view
      window._intervals = [];
      window.getExercises = null;
      window._pendingSuggestions = {};
      const wk = state.selectedWeek;
      const day = SESSION_DAYS[state.selectedDayIndex];
      const data = WEEKS[wk];
      const planned = getPlanned(wk, day.key) || '';
      const sessionKey = `${wk}_${day.key}`;
      const isRun = isRunSession(day.key);
      const isCompleted = state.completedSessions[sessionKey];

      // Load saved session data
      const savedData = await loadSession(wk, sessionKey);

      let html = `
        <button class="back-btn" id="backToWeek">← Week ${wk}</button>
        <div class="logger-header">
          <span class="logger-icon">${isCompleted ? '✅' : day.icon}</span>
          <div>
            <div class="logger-title">${day.label}</div>
            <div class="logger-sub">${day.sub}</div>
          </div>
        </div>
        ${planned ? `
          <div class="card planned-card">
            <div class="planned-label">Planned</div>
            <div class="session-content">${formatSessionContent(planned, day.color)}</div>
          </div>
        ` : ''}
        <div class="card">
          <div class="planned-label">Log Session</div>
          
          <div class="form-row" style="border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px">
            <div class="form-label">Sleep Quality Last Night (1–10)</div>
            <input type="text" class="form-input" id="sleepQuality" placeholder="e.g. 7" style="width:80px" value="${savedData.sleepQuality || ''}">
          </div>
      `;

      if (isRun) {
        const isZone2 = day.key === 'easy' || day.key === 'longRun';
        const isIntervals = day.key === 'quality' && planned && planned.includes('[INTERVALS]');
        const isTempo    = day.key === 'quality' && planned && planned.includes('[TEMPO]');

        if (isIntervals) {
          // Parse planned interval count & distance e.g. "6×400m"
          const planMatch = planned.match(/(\d+)[×x](\S+)/);
          const planCount = planMatch ? parseInt(planMatch[1]) : 4;
          const planDist  = planMatch ? planMatch[2] : '';
          // Restore saved intervals or seed from plan
          let intervals = (savedData.intervals && savedData.intervals.length > 0)
            ? savedData.intervals
            : Array.from({length: planCount}, () => ({ distance: planDist, time: '', hr: '', rpe: '' }));
          // Store in window so save handler can read
          window._intervals = intervals;

          function renderIntervalRows() {
            const tbody = document.getElementById('intervalBody');
            if (!tbody) return;
            tbody.innerHTML = window._intervals.map((iv, i) => `
              <tr>
                <td style="padding:4px 6px;font-size:11px;color:var(--text-muted);font-family:'DM Mono',monospace;text-align:center;">${i+1}</td>
                <td style="padding:4px 4px;">
                  <input type="text" class="form-input iv-input" data-iv="${i}" data-field="distance"
                    style="font-size:11px;padding:4px 6px;text-align:center;" value="${iv.distance || ''}" placeholder="${planDist || 'dist'}">
                </td>
                <td style="padding:4px 4px;">
                  <input type="text" class="form-input iv-input" data-iv="${i}" data-field="time"
                    style="font-size:11px;padding:4px 6px;text-align:center;" value="${iv.time || ''}" placeholder="m:ss">
                </td>
                <td style="padding:4px 4px;">
                  <input type="text" class="form-input iv-input" data-iv="${i}" data-field="hr"
                    style="font-size:11px;padding:4px 6px;text-align:center;" value="${iv.hr || ''}" placeholder="bpm">
                </td>
                <td style="padding:4px 4px;">
                  <input type="text" class="form-input iv-input" data-iv="${i}" data-field="rpe"
                    style="font-size:11px;padding:4px 6px;text-align:center;" value="${iv.rpe || ''}" placeholder="1–10">
                </td>
                <td style="padding:4px 2px;text-align:center;">
                  <button class="remove-btn iv-remove" data-iv="${i}" style="font-size:13px;padding:2px 5px;" title="Remove">×</button>
                </td>
              </tr>
            `).join('');
            // bind inputs
            tbody.querySelectorAll('.iv-input').forEach(inp => {
              inp.addEventListener('input', () => {
                window._intervals[parseInt(inp.dataset.iv)][inp.dataset.field] = inp.value;
              });
            });
            tbody.querySelectorAll('.iv-remove').forEach(btn => {
              btn.addEventListener('click', () => {
                window._intervals.splice(parseInt(btn.dataset.iv), 1);
                renderIntervalRows();
              });
            });
          }

          html += `
            <div class="card mb-12">
              <div style="font-size:11px;font-weight:600;color:var(--text-muted);font-family:'DM Mono',monospace;margin-bottom:10px;letter-spacing:0.5px;">⚡ INTERVAL LOG</div>
              <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;">
                  <thead>
                    <tr style="border-bottom:1px solid var(--border);">
                      <th style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;padding:4px 6px;text-align:center;">#</th>
                      <th style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;padding:4px 6px;text-align:center;">Dist</th>
                      <th style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;padding:4px 6px;text-align:center;">Time</th>
                      <th style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;padding:4px 6px;text-align:center;">HR</th>
                      <th style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;padding:4px 6px;text-align:center;">RPE</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="intervalBody"></tbody>
                </table>
              </div>
              <button id="addIntervalBtn" style="margin-top:10px;font-size:11px;padding:5px 12px;background:var(--bg-card-alt);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-family:'DM Mono',monospace;color:var(--text);">+ Add interval</button>
            </div>
            <div class="form-grid mb-12">
              <div>
                <div class="form-label">Total Distance (km)</div>
                <input type="text" class="form-input" id="runKm" placeholder="e.g. 5.0" value="${savedData.runKm || ''}">
              </div>
              <div>
                <div class="form-label">Avg HR (bpm)</div>
                <input type="text" class="form-input" id="avgHR" placeholder="e.g. 168" value="${savedData.avgHR || ''}">
              </div>
            </div>
            <input type="hidden" id="runPace" value="${savedData.runPace || ''}">
            <input type="hidden" id="maxHR" value="${savedData.maxHR || ''}">
            <div id="zoneCompliance"></div>
          `;
          // Defer binding until DOM is ready
          setTimeout(() => {
            renderIntervalRows();
            const addBtn = document.getElementById('addIntervalBtn');
            if (addBtn) addBtn.addEventListener('click', () => {
              window._intervals.push({ distance: planDist, time: '', hr: '', rpe: '' });
              renderIntervalRows();
            });
          }, 0);
        } else {
          // Zone 2 easy/long run OR tempo — simple overall fields
          html += `
            <div class="form-grid mb-12">
              <div>
                <div class="form-label">Distance (km)</div>
                <input type="text" class="form-input" id="runKm" placeholder="e.g. 5.2" value="${savedData.runKm || ''}">
              </div>
              <div>
                <div class="form-label">Avg Pace (/km)</div>
                <input type="text" class="form-input" id="runPace" placeholder="e.g. 6:10" value="${savedData.runPace || ''}">
              </div>
            </div>
            <div class="form-grid mb-12">
              <div>
                <div class="form-label ${isZone2 ? 'important' : ''}">Avg HR (bpm) ${isZone2 ? '· Zone 2 check' : ''}</div>
                <input type="text" class="form-input ${isZone2 ? 'important' : ''}" id="avgHR" placeholder="e.g. 132" value="${savedData.avgHR || ''}">
              </div>
              <div>
                <div class="form-label">Max HR (bpm)</div>
                <input type="text" class="form-input" id="maxHR" placeholder="e.g. 148" value="${savedData.maxHR || ''}">
              </div>
            </div>
            <div id="zoneCompliance"></div>
          `;
        }
      } else {
        html += `
          <div id="exerciseContainer"></div>
          <button class="add-exercise-btn" id="addExercise">+ Add Exercise</button>
          <div id="exerciseSuggestions" class="suggestions-dropdown hidden"></div>
        `;
      }

      html += `
          <div class="form-row">
            <div class="form-label">Session RPE (1–10)</div>
            <input type="text" class="form-input" id="rpe" placeholder="e.g. 7" style="width:80px" value="${savedData.rpe || ''}">
          </div>
          <div class="form-row mb-16">
            <div class="form-label">Session Notes</div>
            <textarea class="form-input form-textarea" id="notes" placeholder="How did it feel? Any technique notes...">${savedData.notes || ''}</textarea>
          </div>
          <div class="btn-row">
            <button class="btn-primary" id="saveSession">Save Session</button>
            <button class="btn-secondary" id="askCoach">🧠 AI Coach</button>
          </div>
        </div>
        <div id="aiResponse"></div>
      `;

      document.getElementById('program-tab').innerHTML = html;

      // Event handlers
      document.getElementById('backToWeek').addEventListener('click', () => {
        state.programView = 'week';
        renderProgram();
      });

      if (isRun) {
        const avgHRInput = document.getElementById('avgHR');
        const isZone2 = day.key === 'easy' || day.key === 'longRun';
        
        avgHRInput.addEventListener('input', () => {
          if (isZone2 && avgHRInput.value) {
            const hr = parseInt(avgHRInput.value);
            const compDiv = document.getElementById('zoneCompliance');
            // Read dynamic Z2 ceiling from configured zones (was hardcoded 137 pre-v1.01).
            const z2 = getZ2Range();
            if (hr <= z2.high) {
              compDiv.innerHTML = `<div class="zone-compliance good">✓ Zone 2 compliance: ${hr} bpm is within ${z2.low}–${z2.high}</div>`;
            } else {
              compDiv.innerHTML = `<div class="zone-compliance bad">⚠️ HR too high: ${hr} bpm is above Zone 2 (max ${z2.high}). Slow down or walk uphills.</div>`;
            }
          }
        });
        
        // Trigger initial check
        if (savedData.avgHR && isZone2) {
          avgHRInput.dispatchEvent(new Event('input'));
        }
      } else {
        // Load custom exercises from localStorage
        const defaultExercises = [
          'Flat BP', 'Incline DB Press', 'CGBP', 'Cable Fly', 'Dips',
          'Weighted Pull-Ups', 'BB Row', 'Cable Row', 'Lat Pulldown',
          'Back Squat', 'Deadlift', 'RDL', 'Leg Press', 'Hack Squat',
          'Hip Thrust', 'Nordic Curl', 'Calf Raises', 'Leg Curl',
          'DB Lateral Raise', 'Rear Delt Fly', 'Face Pull', 'OHP',
          'OH Tricep Ext', 'DB Curl', 'Hammer Curl', 'Skull Crusher',
          'Turkish Get-Up', 'Pallof Press', 'Dead Bug', 'Ab Wheel',
          'Suitcase Carry', 'Hanging Knee Raise', 'Pause Squat', 'Split Squat'
        ];
        let customExercises = JSON.parse(localStorage.getItem('customExercises') || '[]');
        const allExerciseSuggestions = [...new Set([...defaultExercises, ...customExercises])].sort();
        
        // Exercise logger - pre-populate from plan
        const parsedExercises = parseExercisesFromPlan(planned);
        
        // Use saved data if available, otherwise use parsed exercises
        let exercises;
        if (savedData.exercises && savedData.exercises.length > 0) {
          exercises = savedData.exercises;
        } else if (parsedExercises.length > 0) {
          // Try to pre-fill weights from the most recent previous saved session of the same type.
          // Uses loadSession (Supabase-aware) so it works across devices, not just on the device that last saved.
          let prevSessionData = null;
          for (let lookback = 1; lookback <= 8; lookback++) {
            const prevWk = wk - lookback;
            if (prevWk < 1) break;
            try {
              const prev = await loadSession(prevWk, `${prevWk}_${day.key}`);
              if (prev && prev.exercises && prev.exercises.length > 0) {
                prevSessionData = prev;
                break;
              }
            } catch {}
          }
          // Build name→last-logged maps for both weight and reps.
          // Reps preload is new in v1.0: previously only weight was preloaded,
          // which forced the user to re-type reps every session even when
          // the prescription didn't change.
          const prevWeightMap = {};
          const prevRepsMap = {};
          if (prevSessionData) {
            prevSessionData.exercises.forEach(ex => {
              if (!ex.name) return;
              const normName = ex.name.toLowerCase().trim();
              const setsWithWeight = (ex.sets || []).filter(s => parseFloat(s.weight) > 0);
              if (setsWithWeight.length > 0) {
                prevWeightMap[normName] = setsWithWeight[setsWithWeight.length - 1].weight;
              }
              const setsWithReps = (ex.sets || []).filter(s => parseInt(s.reps, 10) > 0);
              if (setsWithReps.length > 0) {
                prevRepsMap[normName] = setsWithReps[setsWithReps.length - 1].reps;
              }
            });
          }
          // Apply preload to each set:
          //   1. previous-session value wins,
          //   2. else fall back to plan target if it parses to a clean number,
          //   3. else leave blank (user enters manually).
          // Critically these are written into the set as *values*, so the
          // save handler picks them up even if the user never touches the
          // input. (Pre-v1.0 they lived only in placeholders and were lost.)
          exercises = parsedExercises.map(ex => {
            const normName = ex.name.toLowerCase().trim();
            const prevW = prevWeightMap[normName];
            const prevR = prevRepsMap[normName];
            return {
              ...ex,
              sets: ex.sets.map(s => {
                let weight = s.weight;
                let reps = s.reps;
                if (!weight) {
                  if (prevW) {
                    weight = String(prevW);
                  } else {
                    const planW = parseWeightTarget(s.targetWeight);
                    if (planW != null) weight = String(planW);
                  }
                }
                if (!reps) {
                  if (prevR) {
                    reps = String(prevR);
                  } else {
                    const planR = parseRepsTarget(s.targetReps);
                    if (planR != null) reps = String(planR);
                  }
                }
                return { ...s, weight, reps };
              })
            };
          });
        } else {
          exercises = [{ name: 'Exercise', notes: '', sets: [{ targetReps: '', targetWeight: '', reps: '', weight: '', rpe: '' }] }];
        }
        
        function renderExercises() {
          const container = document.getElementById('exerciseContainer');
          container.innerHTML = exercises.map((ex, exIdx) => `
            <div class="exercise-block" data-ex="${exIdx}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
                <div>
                  <div style="font-size:14px;font-weight:600;color:var(--accent);font-family:'DM Mono',monospace;">${escapeHtml(ex.name)}</div>
                  ${ex.notes ? `<div style="font-size:10px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-top:2px;">${escapeHtml(ex.notes)}</div>` : ''}
                  ${(() => {
                    const targetReps = ex.sets[0]?.targetReps ? parseInt(ex.sets[0].targetReps) || null : null;
                    const sug = getExerciseSuggestion(ex.name, targetReps);
                    if (!sug) return '';
                    const sugText = sug.suggested ? ` · suggest <strong>${sug.suggested} kg</strong>${targetReps ? ' for ' + targetReps + ' reps' : ''}` : '';
                    const lastText = sug.last ? `Last: ${sug.last.w} kg × ${sug.last.r}${sug.last.rpe ? ' @ RPE ' + sug.last.rpe : ''}` : '';
                    return `<div style="font-size:10px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-top:3px;">${lastText}${sugText}</div>`;
                  })()}
                </div>
                <button class="remove-btn" data-remove-ex="${exIdx}" title="Remove exercise">×</button>
              </div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:6px 8px;background:var(--bg-card-alt);border-radius:6px;">
                <div style="font-size:10px;color:var(--text-muted);font-family:'DM Mono',monospace;white-space:nowrap;">All sets:</div>
                <input type="text" class="form-input bulk-weight" data-bulk-ex="${exIdx}" placeholder="kg — fills all sets" style="flex:1;font-size:12px;padding:4px 8px;">
              </div>
              <div style="display:grid;grid-template-columns:32px 1fr 1fr 60px 28px;gap:6px;margin-bottom:6px;">
                <div style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;">Set</div>
                <div style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;">Weight</div>
                <div style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;">Reps</div>
                <div style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;">RPE</div>
                <div></div>
              </div>
              ${ex.sets.map((s, setIdx) => `
                <div style="display:grid;grid-template-columns:32px 1fr 1fr 60px 28px;gap:6px;margin-bottom:6px;align-items:center;">
                  <div style="font-size:12px;color:var(--text-sub);font-family:'DM Mono',monospace;text-align:center;">${setIdx + 1}</div>
                  <div>
                    <input type="text" class="form-input" data-ex="${exIdx}" data-set="${setIdx}" data-field="weight" 
                      placeholder="${s.targetWeight || 'kg'}" value="${escapeHtml(s.weight || '')}">
                  </div>
                  <div>
                    <input type="text" class="form-input" data-ex="${exIdx}" data-set="${setIdx}" data-field="reps" 
                      placeholder="${s.targetReps || 'reps'}" value="${escapeHtml(s.reps || '')}">
                  </div>
                  <div>
                    <input type="text" class="form-input" data-ex="${exIdx}" data-set="${setIdx}" data-field="rpe" 
                      placeholder="—" value="${escapeHtml(s.rpe || '')}" style="text-align:center;">
                  </div>
                  <button class="remove-btn" data-remove-set="${exIdx}-${setIdx}" style="font-size:14px;padding:2px;" title="Remove set">×</button>
                </div>
              `).join('')}
              <div style="display:flex;gap:8px;margin-top:6px;align-items:center;">
                <button class="add-set-btn" data-add-set="${exIdx}">+ Set</button>
                <button class="save-ex-btn" data-save-ex="${exIdx}" style="font-size:11px;padding:4px 10px;background:var(--success);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:'DM Mono',monospace;">💾 Save exercise</button>
                <span class="save-ex-confirm" id="save-ex-confirm-${exIdx}" style="font-size:10px;color:var(--success);opacity:0;transition:opacity 0.3s;font-family:'DM Mono',monospace;">✓ saved</span>
              </div>
            </div>
          `).join('');

          // Add event listeners for inputs
          container.querySelectorAll('[data-field]').forEach(input => {
            input.addEventListener('input', () => {
              const exIdx = parseInt(input.dataset.ex);
              const setIdx = parseInt(input.dataset.set);
              const field = input.dataset.field;
              // Normalize comma to dot for weight fields
              let val = input.value;
              if (field === 'weight') {
                val = val.replace(',', '.');
                if (val !== input.value) {
                  input.value = val;
                }
              }
              exercises[exIdx].sets[setIdx][field] = val;
            });
          });

          // Bulk weight: fill all sets for an exercise
          container.querySelectorAll('.bulk-weight').forEach(input => {
            input.addEventListener('change', () => {
              const exIdx = parseInt(input.dataset.bulkEx);
              let val = input.value.replace(',', '.').trim();
              if (!val) return;
              exercises[exIdx].sets.forEach(s => s.weight = val);
              renderExercises();
            });
          });
          
          // Add set buttons
          container.querySelectorAll('[data-add-set]').forEach(btn => {
            btn.addEventListener('click', () => {
              const exIdx = parseInt(btn.dataset.addSet);
              const lastSet = exercises[exIdx].sets[exercises[exIdx].sets.length - 1] || {};
              exercises[exIdx].sets.push({ 
                targetReps: lastSet.targetReps || '', 
                targetWeight: lastSet.targetWeight || '', 
                reps: '', 
                weight: '', 
                rpe: '' 
              });
              renderExercises();
            });
          });
          
          // Remove set buttons
          container.querySelectorAll('[data-remove-set]').forEach(btn => {
            btn.addEventListener('click', () => {
              const [exIdx, setIdx] = btn.dataset.removeSet.split('-').map(Number);
              if (exercises[exIdx].sets.length > 1) {
                exercises[exIdx].sets.splice(setIdx, 1);
                renderExercises();
              }
            });
          });
          
          // Remove exercise buttons
          container.querySelectorAll('[data-remove-ex]').forEach(btn => {
            btn.addEventListener('click', () => {
              const exIdx = parseInt(btn.dataset.removeEx);
              if (exercises.length > 1) {
                exercises.splice(exIdx, 1);
                renderExercises();
              }
            });
          });

          // Bind save-exercise buttons after every render
          bindSaveExButtons();
        }

        renderExercises();
        
        // Save individual exercise buttons
        function bindSaveExButtons() {
          document.querySelectorAll('[data-save-ex]').forEach(btn => {
            btn.addEventListener('click', async () => {
              const exIdx = parseInt(btn.dataset.saveEx);
              const exList = window.getExercises ? window.getExercises() : [];
              const payload = {
                sleepQuality: document.getElementById('sleepQuality')?.value || '',
                rpe: document.getElementById('rpe')?.value || '',
                notes: document.getElementById('notes')?.value || '',
                savedAt: new Date().toISOString(),
                exercises: exList
              };
              // PR detection before save
              const exPRs = updateExercisePRs(exList, wk);
              await saveSession(wk, sessionKey, payload);
              const confirm = document.getElementById('save-ex-confirm-' + exIdx);
              if (confirm) {
                confirm.style.opacity = '1';
                setTimeout(() => { confirm.style.opacity = '0'; }, 2000);
              }
              // Show PR toast
              if (exPRs.length > 0) {
                const existing = document.getElementById('prToast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.id = 'prToast';
                toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1612;padding:12px 18px;border-radius:10px;font-family:DM Mono,monospace;font-size:12px;z-index:999;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,0.25);';
                toast.innerHTML = '<div style="font-weight:700;margin-bottom:6px;">🏆 New PR' + (exPRs.length > 1 ? 's' : '') + '!</div>' +
                  exPRs.map(pr => {
                    const prev = pr.prev ? ` (prev ${pr.prev} kg)` : ' (first log)';
                    return `<div>${escapeHtml(pr.exName)}: ${pr.weight} kg × ${pr.reps}${prev}</div>`;
                  }).join('');
                document.body.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
              }
            });
          });
        }

        // Add Exercise with suggestions
        const addExerciseBtn = document.getElementById('addExercise');
        const suggestionsDiv = document.getElementById('exerciseSuggestions');
        let showingSuggestions = false;
        
        function showSuggestions(filter = '') {
          const filtered = allExerciseSuggestions.filter(e => 
            e.toLowerCase().includes(filter.toLowerCase())
          ).slice(0, 10);
          
          suggestionsDiv.innerHTML = `
            <div style="padding:8px;">
              <input type="text" class="form-input" id="exerciseSearchInput" placeholder="Search or type new..." 
                value="${escapeHtml(filter)}" style="margin-bottom:8px;">
            </div>
            <div style="max-height:200px;overflow-y:auto;">
              ${filtered.map(name => `
                <div class="suggestion-item" data-name="${escapeHtml(name)}">${escapeHtml(name)}</div>
              `).join('')}
              ${filter && !filtered.some(e => e.toLowerCase() === filter.toLowerCase()) ? `
                <div class="suggestion-item suggestion-new" data-name="${escapeHtml(filter)}">
                  + Add "${escapeHtml(filter)}" as new exercise
                </div>
              ` : ''}
            </div>
          `;
          suggestionsDiv.classList.remove('hidden');
          showingSuggestions = true;
          
          // Focus search input
          const searchInput = document.getElementById('exerciseSearchInput');
          searchInput.focus();
          
          // Search input handler
          searchInput.addEventListener('input', (e) => {
            showSuggestions(e.target.value);
          });
          
          // Enter key to add custom
          searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && searchInput.value.trim()) {
              addNewExercise(searchInput.value.trim());
            } else if (e.key === 'Escape') {
              hideSuggestions();
            }
          });
          
          // Click on suggestion
          suggestionsDiv.querySelectorAll('.suggestion-item').forEach(item => {
            item.addEventListener('click', () => {
              addNewExercise(item.dataset.name);
            });
          });
        }
        
        function hideSuggestions() {
          suggestionsDiv.classList.add('hidden');
          showingSuggestions = false;
        }
        
        function addNewExercise(name) {
          // Save to custom exercises if not in defaults
          if (!defaultExercises.includes(name) && !customExercises.includes(name)) {
            customExercises.push(name);
            localStorage.setItem('customExercises', JSON.stringify(customExercises));
            saveState().catch(e => console.warn('saveState error (addNewExercise):', e)); // sync to Supabase
          }
          
          exercises.push({
            name: name,
            notes: '',
            sets: [{ targetReps: '', targetWeight: '', reps: '', weight: '', rpe: '' }]
          });
          
          hideSuggestions();
          renderExercises();
        }
        
        addExerciseBtn.addEventListener('click', () => {
          if (showingSuggestions) {
            hideSuggestions();
          } else {
            showSuggestions();
          }
        });
        
        // Close suggestions when clicking outside — remove old listener first to prevent leaks
        if (window._suggestionClickHandler) {
          document.removeEventListener('click', window._suggestionClickHandler);
        }
        window._suggestionClickHandler = (e) => {
          if (showingSuggestions && !suggestionsDiv.contains(e.target) && e.target !== addExerciseBtn) {
            hideSuggestions();
          }
        };
        document.addEventListener('click', window._suggestionClickHandler);

        // Store exercises getter for save
        window.getExercises = () => exercises;
      }

      // Save handler
      document.getElementById('saveSession').addEventListener('click', async () => {
        const payload = {
          sleepQuality: document.getElementById('sleepQuality').value,
          rpe: document.getElementById('rpe').value,
          notes: document.getElementById('notes').value,
          savedAt: new Date().toISOString()
        };

        if (isRun) {
          payload.runKm = document.getElementById('runKm').value;
          payload.runPace = document.getElementById('runPace').value;
          payload.avgHR = document.getElementById('avgHR').value;
          payload.maxHR = document.getElementById('maxHR').value;
          // Collect interval data if this was an intervals session
          if (window._intervals && window._intervals.length > 0) {
            payload.intervals = window._intervals.filter(iv => iv.time || iv.hr || iv.rpe || iv.distance);
          }
        } else {
          payload.exercises = window.getExercises();
        }

        await saveSession(wk, sessionKey, payload);
        state.completedSessions[sessionKey] = true;

        // Refresh home widget so completion count updates immediately
        renderHome();

        // PR detection after successful local save
        let newPRs = [];
        if (!isRun && payload.exercises) {
          newPRs = updateExercisePRs(payload.exercises, wk);
        }

        await saveState();

        const btn = document.getElementById('saveSession');
        if (btn) {
          btn.textContent = '✓ Saved';
          btn.classList.add('saved');
          setTimeout(() => {
            if (document.getElementById('saveSession')) {
              btn.textContent = 'Save Session';
              btn.classList.remove('saved');
            }
          }, 2000);
        }

        // Show PR toast if any new PRs
        if (newPRs.length > 0) {
          const existing = document.getElementById('prToast');
          if (existing) existing.remove();
          const toast = document.createElement('div');
          toast.id = 'prToast';
          toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1612;padding:12px 18px;border-radius:10px;font-family:DM Mono,monospace;font-size:12px;z-index:999;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,0.25);';
          toast.innerHTML = '<div style="font-weight:700;margin-bottom:6px;">🏆 New PR' + (newPRs.length > 1 ? 's' : '') + '!</div>' +
            newPRs.map(pr => {
              const prev = pr.prev ? ` (prev ${pr.prev} kg)` : ' (first log)';
              return `<div>${escapeHtml(pr.exName)}: ${pr.weight} kg × ${pr.reps}${prev}</div>`;
            }).join('');
          document.body.appendChild(toast);
          setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
        }
      });

      // ── Coach: Program Suggestion Builder ──
      let _suggestionCounter = 0;
      function buildCoachSuggestions({ wk, dayKey, km, avgHR, rpe, planned, exs, sleep }) {
        const suggestions = [];
        const deloadWeeks = [11,17];
        const attemptWeeks = [12,18];
        const targetWk = wk + 1;
        if (!WEEKS[targetWk]) return suggestions;
        if (deloadWeeks.includes(targetWk) || attemptWeeks.includes(targetWk)) return suggestions;

        const isZone2 = dayKey === 'easy' || dayKey === 'longRun';
        const isQuality = dayKey === 'quality';
        const isStrength = !isZone2 && !isQuality;
        const sessionLabel = { easy: 'easy run', longRun: 'long run', quality: 'quality run', upperA: 'Upper A', upperB: 'Upper B', lower: 'legs session' }[dayKey] || dayKey;

        if (isZone2 && km > 0 && planned) {
          const plannedMatch = planned.match(/^(\d+(?:\.\d+)?)/);
          const plannedKm = plannedMatch ? parseFloat(plannedMatch[1]) : 0;
          const nextPlanned = getPlanned(targetWk, dayKey);
          if (nextPlanned && plannedKm > 0) {
            const nextMatch = nextPlanned.match(/^(\d+(?:\.\d+)?)/);
            const nextKm = nextMatch ? parseFloat(nextMatch[1]) : 0;
            if (nextKm > 0) {
              // Over-performed with good metrics → bump next session (relaxed thresholds)
              if (km >= plannedKm * 1.05 && (avgHR <= 0 || avgHR <= 140) && (rpe === null || rpe <= 7)) {
                const suggestedKm = nextKm + 1;
                const newValue = nextPlanned.replace(/^\d+(?:\.\d+)?/, suggestedKm);
                suggestions.push({
                  id: ++_suggestionCounter,
                  ts: new Date().toISOString(),
                  label: `Bump Wk ${targetWk} ${sessionLabel}: ${nextKm} → ${suggestedKm} km`,
                  emoji: '📈',
                  reason: `You covered ${km} km vs planned ${plannedKm} km${avgHR > 0 ? ` at avg HR ${avgHR} bpm` : ''}${rpe !== null ? `, RPE ${rpe}` : ''}. Session was within capacity — a conservative +1 km step-up is appropriate.`,
                  week: targetWk,
                  sessionKey: dayKey,
                  oldValue: nextPlanned,
                  newValue
                });
              }
              // Low RPE alone (even without distance over-performance) → small bump
              else if (rpe !== null && rpe <= 4 && (avgHR <= 0 || avgHR <= 137) && nextKm > 0) {
                const suggestedKm = nextKm + 0.5;
                const newValue = nextPlanned.replace(/^\d+(?:\.\d+)?/, suggestedKm);
                suggestions.push({
                  id: ++_suggestionCounter,
                  ts: new Date().toISOString(),
                  label: `Nudge Wk ${targetWk} ${sessionLabel}: ${nextKm} → ${suggestedKm} km`,
                  emoji: '📈',
                  reason: `RPE ${rpe} shows this was genuinely easy. A small +0.5 km nudge accumulates aerobic volume without risking Z2 drift.`,
                  week: targetWk,
                  sessionKey: dayKey,
                  oldValue: nextPlanned,
                  newValue
                });
              }
              // HR drifted too high → consider reducing
              else if (avgHR > 138 && km > 0 && nextKm > 4) {
                const suggestedKm = Math.max(Math.round((nextKm - 1) * 2) / 2, 5);
                const newValue = nextPlanned.replace(/^\d+(?:\.\d+)?/, suggestedKm);
                suggestions.push({
                  id: ++_suggestionCounter,
                  ts: new Date().toISOString(),
                  label: `Reduce Wk ${targetWk} ${sessionLabel}: ${nextKm} → ${suggestedKm} km`,
                  emoji: '📉',
                  reason: `Avg HR ${avgHR} bpm was above Zone 2 ceiling (137 bpm). This session accumulated more cardiovascular stress than intended — trimming Wk ${targetWk} slightly protects aerobic adaptation quality.`,
                  week: targetWk,
                  sessionKey: dayKey,
                  oldValue: nextPlanned,
                  newValue
                });
              }
              // High RPE on an easy run → also a reduce signal (fatigue / under-recovery)
              else if (rpe !== null && rpe >= 7 && nextKm > 4 && (avgHR <= 0 || avgHR > 130)) {
                const suggestedKm = Math.max(Math.round((nextKm - 1) * 2) / 2, 5);
                const newValue = nextPlanned.replace(/^\d+(?:\.\d+)?/, suggestedKm);
                suggestions.push({
                  id: ++_suggestionCounter,
                  ts: new Date().toISOString(),
                  label: `Reduce Wk ${targetWk} ${sessionLabel}: ${nextKm} → ${suggestedKm} km`,
                  emoji: '📉',
                  reason: `RPE ${rpe} on an easy run is a fatigue flag — a truly aerobic session should feel like 3–5. Trimming Wk ${targetWk} protects recovery for strength days.`,
                  week: targetWk,
                  sessionKey: dayKey,
                  oldValue: nextPlanned,
                  newValue
                });
              }
            }
          }
        }

        if (isQuality && rpe !== null && rpe <= 7) {
          const nextQuality = getPlanned(targetWk, 'quality');
          if (nextQuality) {
            const intMatch = nextQuality.match(/(\d+)×(\d+)m/);
            const intKmMatch = nextQuality.match(/(\d+)×(\d+)\s*km/);
            const tempoMatch = nextQuality.match(/(\d+)\s*min\s*(continuous|@)/i);
            const repBump = rpe <= 5 ? 2 : 1;
            const tempoBump = rpe <= 5 ? 5 : 3;
            if (intMatch) {
              const reps = parseInt(intMatch[1]);
              const dist = intMatch[2];
              const newReps = reps + repBump;
              const newValue = nextQuality.replace(`${reps}×${dist}m`, `${newReps}×${dist}m`);
              suggestions.push({
                id: ++_suggestionCounter,
                ts: new Date().toISOString(),
                label: `Add ${repBump} rep${repBump > 1 ? 's' : ''} to Wk ${targetWk} intervals: ${reps}×${dist}m → ${newReps}×${dist}m`,
                emoji: '📈',
                reason: `RPE ${rpe} on today's session shows capacity for progression. +${repBump} rep at the same pace is a conservative step.`,
                week: targetWk,
                sessionKey: 'quality',
                oldValue: nextQuality,
                newValue
              });
            } else if (intKmMatch) {
              const reps = parseInt(intKmMatch[1]);
              const dist = intKmMatch[2];
              const newReps = reps + 1;
              const newValue = nextQuality.replace(`${reps}×${dist} km`, `${newReps}×${dist} km`);
              suggestions.push({
                id: ++_suggestionCounter,
                ts: new Date().toISOString(),
                label: `Add 1 rep to Wk ${targetWk} intervals: ${reps}×${dist} km → ${newReps}×${dist} km`,
                emoji: '📈',
                reason: `RPE ${rpe} indicates headroom for volume progression. +1 km-rep at the same pace.`,
                week: targetWk,
                sessionKey: 'quality',
                oldValue: nextQuality,
                newValue
              });
            } else if (tempoMatch) {
              const mins = parseInt(tempoMatch[1]);
              const newMins = mins + tempoBump;
              const newValue = nextQuality.replace(`${mins} min`, `${newMins} min`);
              suggestions.push({
                id: ++_suggestionCounter,
                ts: new Date().toISOString(),
                label: `Extend Wk ${targetWk} tempo: ${mins} → ${newMins} min`,
                emoji: '📈',
                reason: `RPE ${rpe} indicates this tempo was within your lactate threshold. +${tempoBump} min keeps aerobic stimulus progressing without pushing anaerobic.`,
                week: targetWk,
                sessionKey: 'quality',
                oldValue: nextQuality,
                newValue
              });
            }
          }
        }

        if (isStrength && !deloadWeeks.includes(targetWk) && !attemptWeeks.includes(targetWk)) {
          const nextPlannedGym = getPlanned(targetWk, dayKey);
          if (nextPlannedGym && exs && exs.length > 0) {
            const nextLines = nextPlannedGym.split('\n');
            const sessionLabel = { upperA: 'Upper A', upperB: 'Upper B', lower: 'Legs' }[dayKey] || dayKey;

            // ── Per-exercise analysis ──
            const exChanges = [];   // { exName, from, to, line, newLine, reason }
            const holdItems  = [];  // exercises to hold flat

            for (const ex of exs) {
              if (!ex.name || !ex.sets || ex.sets.length === 0) continue;
              const weights = ex.sets.map(s => parseFloat(s.weight)).filter(w => !isNaN(w) && w > 0);
              if (weights.length === 0) continue;

              const topWeight = Math.max(...weights);
              const setRPEs   = ex.sets.map(s => parseFloat(s.rpe)).filter(r => !isNaN(r) && r > 0);
              const avgSetRpe = setRPEs.length > 0 ? (setRPEs.reduce((a,b) => a+b,0) / setRPEs.length) : null;
              const effectiveRpe = avgSetRpe !== null ? avgSetRpe : rpe;
              if (effectiveRpe === null) continue;

              // Find matching line in next week's plan (case-insensitive substring)
              const exLower = ex.name.toLowerCase().trim();
              const matchLine = nextLines.find(line => {
                const ll = line.toLowerCase();
                return ll.includes(exLower) || exLower.split(' ').filter(w => w.length > 3).every(w => ll.includes(w));
              });
              if (!matchLine) continue;

              // Only act on kg-based weights (skip % and bodyweight)
              const wMatch = matchLine.match(/@(\d+(?:\.\d+)?)\s*kg/);
              if (!wMatch) continue;
              const plannedW = parseFloat(wMatch[1]);
              const rpeLabel = avgSetRpe !== null ? `avg set RPE ${avgSetRpe.toFixed(1)}` : `session RPE ${effectiveRpe}`;

              if (effectiveRpe <= 5) {
                const newW = plannedW + 5;
                const newLine = matchLine.replace(`@${wMatch[1]} kg`, `@${newW} kg`);
                exChanges.push({ exName: ex.name, from: plannedW, to: newW, line: matchLine, newLine, reason: `${rpeLabel} — strong capacity, +5 kg` });
              } else if (effectiveRpe <= 7) {
                const newW = plannedW + 2.5;
                const newLine = matchLine.replace(`@${wMatch[1]} kg`, `@${newW} kg`);
                exChanges.push({ exName: ex.name, from: plannedW, to: newW, line: matchLine, newLine, reason: `${rpeLabel} — capacity available, +2.5 kg` });
              } else if (effectiveRpe >= 9 && plannedW > topWeight) {
                const newLine = matchLine.replace(`@${wMatch[1]} kg`, `@${topWeight} kg`);
                exChanges.push({ exName: ex.name, from: plannedW, to: topWeight, line: matchLine, newLine, reason: `${rpeLabel} — at max capacity, drop to today's top weight` });
              } else if (effectiveRpe >= 8.5) {
                holdItems.push(`${ex.name} (${rpeLabel})`);
              }
            }

            // ── Combined bump suggestion ──
            if (exChanges.length > 0) {
              let newValue = nextPlannedGym;
              exChanges.forEach(ch => { newValue = newValue.replace(ch.line, ch.newLine); });
              const bumps   = exChanges.filter(ch => ch.to > ch.from);
              const holds   = exChanges.filter(ch => ch.to <= ch.from);
              const summary = bumps.map(ch => `📈 ${ch.exName}: ${ch.from} → ${ch.to} kg (${ch.reason})`).join('\n') +
                              (holds.length ? '\n' + holds.map(ch => `📉 ${ch.exName}: hold at ${ch.to} kg (${ch.reason})`).join('\n') : '');
              const label   = bumps.length > 0
                ? `Wk ${targetWk} ${sessionLabel}: ${bumps.length} exercise${bumps.length > 1 ? 's' : ''} bumped${holds.length ? `, ${holds.length} held` : ''}`
                : `Wk ${targetWk} ${sessionLabel}: ${holds.length} exercise${holds.length > 1 ? 's' : ''} held flat`;
              suggestions.push({
                id: ++_suggestionCounter,
                ts: new Date().toISOString(),
                label,
                emoji: bumps.length >= holds.length ? '📈' : '📉',
                reason: summary,
                week: targetWk,
                sessionKey: dayKey,
                oldValue: nextPlannedGym,
                newValue
              });
            }

            // ── Hold-only note (no apply needed — just coaching) ──
            if (holdItems.length > 0 && exChanges.length === 0) {
              suggestions.push({
                id: ++_suggestionCounter,
                ts: new Date().toISOString(),
                label: `Wk ${targetWk} ${sessionLabel}: hold weights flat`,
                emoji: '➡️',
                reason: `Max-effort sets logged on: ${holdItems.join(', ')}. The program already has progression built in — don't add to it when you hit the ceiling.`,
                week: targetWk,
                sessionKey: dayKey,
                oldValue: nextPlannedGym,
                newValue: nextPlannedGym
              });
            }
          }
        }

        // ── DELOAD SUGGESTION — fatigue signal (relaxed: either strong single or combined moderate) ──
        const strongSingle = (rpe !== null && rpe >= 9) || (sleep !== null && sleep <= 3);
        const combinedMod  = (rpe !== null && rpe >= 8 && sleep !== null && sleep <= 5);
        if (isStrength && (strongSingle || combinedMod)
            && !deloadWeeks.includes(targetWk) && !attemptWeeks.includes(targetWk)) {
          const nextPlannedGym = getPlanned(targetWk, dayKey);
          if (nextPlannedGym) {
            // Reduce all @X kg weights by 10%, round to nearest 2.5
            const newValue = nextPlannedGym.replace(/@(\d+(?:\.\d+)?)\s*kg/g, (_, w) => {
              const reduced = Math.round((parseFloat(w) * 0.9) / 2.5) * 2.5;
              return `@${reduced} kg`;
            });
            if (newValue !== nextPlannedGym) {
              const sessionLabel = { upperA: 'Upper A', upperB: 'Upper B', lower: 'Legs' }[dayKey] || dayKey;
              suggestions.push({
                id: ++_suggestionCounter,
                ts: new Date().toISOString(),
                label: `Light session Wk ${targetWk} ${sessionLabel} — fatigue flag`,
                emoji: '😴',
                reason: `Fatigue signal: ${rpe !== null ? `RPE ${rpe}` : 'high session effort'}${sleep !== null ? ` + sleep ${sleep}/10` : ''}. All weights reduced ~10% for Wk ${targetWk}. Recovery is where adaptation happens — one lighter week costs nothing.`,
                week: targetWk,
                sessionKey: dayKey,
                oldValue: nextPlannedGym,
                newValue
              });
            }
          }
        }

        return suggestions;
      }

      // ── Built-in Rule-Based AI Coach (no API key needed) ──
      document.getElementById('askCoach').addEventListener('click', () => {
        const btn = document.getElementById('askCoach');
        const rpe = parseFloat(document.getElementById('rpe').value) || null;
        const sleep = parseFloat(document.getElementById('sleepQuality').value) || null;
        const sessionNotes = document.getElementById('notes').value;
        const feedback = [];

        // ── MILESTONE targets per week (bench)
        const benchMilestones = {12:115, 18:120};
        const nextMilestone = Object.entries(benchMilestones).find(([w]) => parseInt(w) >= wk);

        if (isRun) {
          // ── RUN COACHING ──
          const km = parseFloat(document.getElementById('runKm').value) || 0;
          const avgHR = parseInt(document.getElementById('avgHR').value) || 0;
          const maxHR = parseInt(document.getElementById('maxHR').value) || 0;
          const pace = document.getElementById('runPace').value;
          const isZone2 = day.key === 'easy' || day.key === 'longRun';
          const isQuality = day.key === 'quality';

          if (isZone2) {
            if (avgHR > 0 && avgHR <= 130) feedback.push('✅ Excellent Zone 2 control — HR well within 119–137. Your aerobic base is building efficiently.');
            else if (avgHR > 0 && avgHR <= 137) feedback.push(`✅ Good Zone 2 compliance — HR within target range (119–137). Keep this discipline, it's the foundation of everything.`);
            else if (avgHR > 137 && avgHR <= 145) feedback.push('⚠️ HR slightly above Zone 2 (target 119–137). Slow down by 10–15 sec/km on the next easy run. Ego has no place in Zone 2.');
            else if (avgHR > 145) feedback.push('❌ HR too high for Zone 2 — this became a moderate session, which is the worst zone to train in. Slow to a walk on uphills next time. Zone 2 compliance trumps pace.');

            if (km > 0) {
              const planned_km = parseFloat((planned.match(/(\d+(?:\.\d+)?)\s*km/) || [])[1]) || 0;
              if (planned_km > 0 && km >= planned_km) feedback.push(`✅ Distance hit (${km} km ≥ planned ${planned_km} km). Consistent long run progression is your biggest marathon lever.`);
              else if (planned_km > 0 && km < planned_km * 0.9) feedback.push(`📏 Distance short (${km} km vs planned ${planned_km} km). If HR forced you to stop, that's the right call. Don't chase distance at the cost of Zone 2.`);
            }
          }

          if (isQuality) {
            const ivs = (window._intervals || []).filter(iv => iv.time || iv.hr || iv.rpe);
            const isIntervalsSession = planned && planned.includes('[INTERVALS]');

            if (isIntervalsSession && ivs.length > 0) {
              // Per-interval analysis
              const completedCount = ivs.filter(iv => iv.time).length;
              const planMatch = planned.match(/(\d+)[×x]/);
              const planCount = planMatch ? parseInt(planMatch[1]) : null;
              if (planCount) {
                if (completedCount >= planCount) feedback.push(`✅ All ${completedCount} intervals completed. Full session executed.`);
                else feedback.push(`📊 ${completedCount}/${planCount} intervals completed. If you stopped early due to form breakdown or HR spike, that was the right call — never sacrifice quality for quantity.`);
              }

              // Parse times (m:ss format) into seconds
              const parsedTimes = ivs.map(iv => {
                if (!iv.time) return null;
                const parts = iv.time.split(':').map(Number);
                return parts.length === 2 ? parts[0]*60 + parts[1] : parts[0];
              }).filter(t => t !== null);
              if (parsedTimes.length >= 2) {
                const fastest = Math.min(...parsedTimes);
                const slowest = Math.max(...parsedTimes);
                const drift = slowest - fastest;
                const driftPct = Math.round((drift / fastest) * 100);
                if (drift <= 3) feedback.push(`✅ Excellent pace consistency — only ${drift}s spread across intervals. This is a sign of good pacing strategy and aerobic fitness.`);
                else if (driftPct <= 8) feedback.push(`✅ Good pace consistency (${drift}s drift, ~${driftPct}%). Minor fade is normal. Aim to keep the last interval within 5s of the first.`);
                else feedback.push(`⚠️ Pace dropped ${drift}s (${driftPct}%) from fastest to slowest interval. Consider starting slightly more conservatively — going out too hard is the most common interval mistake.`);
                const fastMm = Math.floor(fastest/60), fastSs = String(fastest%60).padStart(2,'0');
                const slowMm = Math.floor(slowest/60), slowSs = String(slowest%60).padStart(2,'0');
                feedback.push(`📊 Split range: ${fastMm}:${fastSs} (fastest) → ${slowMm}:${slowSs} (slowest). Target: ${planned.match(/@([^\n]+)/)?.[1]?.trim() || 'see plan'}.`);
              }

              // HR analysis per interval
              const ivHRs = ivs.map(iv => parseInt(iv.hr)).filter(h => !isNaN(h) && h > 0);
              if (ivHRs.length >= 2) {
                const avgIvHR = Math.round(ivHRs.reduce((a,b)=>a+b,0)/ivHRs.length);
                const maxIvHR = Math.max(...ivHRs);
                if (avgIvHR >= 156 && avgIvHR <= 175) feedback.push(`✅ Avg interval HR ${avgIvHR} bpm — solidly in Zone 4/5 (156–183). This is exactly where interval adaptations happen.`);
                else if (avgIvHR < 156) feedback.push(`📊 Avg interval HR ${avgIvHR} bpm — below Zone 4 (156+). Either pacing was conservative or fitness is good. Push a touch harder next time if splits are consistent.`);
                else if (avgIvHR > 175) feedback.push(`⚠️ Avg interval HR ${avgIvHR} bpm — very high. Ensure recovery intervals are long enough to bring HR below ~140 before the next rep.`);
                if (maxIvHR > 0) feedback.push(`📈 Peak interval HR: ${maxIvHR} bpm (max HR 183 bpm = ${Math.round(maxIvHR/183*100)}%).`);
              }

              // RPE per interval
              const ivRPEs = ivs.map(iv => parseFloat(iv.rpe)).filter(r => !isNaN(r) && r > 0);
              if (ivRPEs.length >= 2) {
                const firstRPE = ivRPEs[0], lastRPE = ivRPEs[ivRPEs.length-1];
                if (lastRPE - firstRPE >= 2) feedback.push(`⚠️ RPE rose from ${firstRPE} to ${lastRPE} across the session — significant fatigue accumulation. Your rest intervals may be too short, or starting pace was too aggressive.`);
                else feedback.push(`✅ RPE progression looks controlled (${firstRPE} → ${lastRPE}). Manageable fatigue across the session.`);
              }
            } else {
              // Tempo or intervals without per-rep data
              if (avgHR > 0 && avgHR < 155) feedback.push('📊 HR suggests effort may have been too easy for a quality session. Tempo should sit at LTHR (161–168 bpm); intervals genuinely hard (Zone 4–5).');
              else if (avgHR >= 155 && avgHR <= 175) feedback.push('✅ HR in the right zone for quality work. This is where your running fitness actually improves.');
              else if (avgHR > 175) feedback.push('⚠️ HR very high — check if this was sustainable or if you went anaerobic. Quality runs should be hard but controlled.');
            }
          }

          if (rpe !== null) {
            if (isZone2 && rpe > 6) feedback.push(`⚠️ RPE ${rpe} is high for an easy/long run — should feel like a 4–5. If it felt hard, you went too fast or are under-recovered.`);
            else if (isZone2 && rpe <= 5) feedback.push(`✅ RPE ${rpe} — exactly right for Zone 2. You should be able to hold a full conversation.`);
            else if (isQuality && rpe >= 7) feedback.push(`✅ RPE ${rpe} for a quality session — solid effort. Fergus would say: if it felt hard, it probably was quality work.`);
          }

          if (nextMilestone) {
            feedback.push(`🎯 Bench ${nextMilestone[1]} kg on Wk ${nextMilestone[0]} — stay disciplined on running volume, don't let it bleed into recovery for the gym. Polarised training: Zone 2 stays Zone 2.`);
          }

        } else {
          // ── GYM COACHING ──
          const exs = (window.getExercises ? window.getExercises() : null) || [];
          const benchEx = exs.find(e => e.name && e.name.toLowerCase().includes('bp') || (e.name && e.name.toLowerCase().includes('bench')));

          // Check bench performance
          if (benchEx && benchEx.sets.length > 0) {
            const weights = benchEx.sets.map(s => parseFloat(s.weight)).filter(w => !isNaN(w));
            const reps = benchEx.sets.map(s => parseInt(s.reps)).filter(r => !isNaN(r));
            const topWeight = Math.max(...weights);
            const totalSets = weights.length;

            // Estimate e1RM using Epley: w * (1 + r/30)
            const e1RM = weights.map((w, i) => reps[i] ? w * (1 + reps[i] / 30) : 0).reduce((a, b) => Math.max(a, b), 0);

            // Planned bench weight from program
            const plannedBenchMatch = planned.match(/@(\d+(?:\.\d+)?)\s*kg/);
            const plannedWeight = plannedBenchMatch ? parseFloat(plannedBenchMatch[1]) : null;

            if (e1RM > 0 && nextMilestone) {
              const gap = nextMilestone[1] - e1RM;
              if (gap <= 5) feedback.push(`🔥 Estimated 1RM ~${Math.round(e1RM)} kg — you're within ${Math.round(gap)} kg of your Wk ${nextMilestone[0]} target (${nextMilestone[1]} kg). Stay the course, the wave is working.`);
              else if (gap <= 12) feedback.push(`📈 Estimated 1RM ~${Math.round(e1RM)} kg vs target ${nextMilestone[1]} kg on Wk ${nextMilestone[0]}. Gap of ${Math.round(gap)} kg — achievable. Trust the wave periodisation.`);
              else feedback.push(`📊 Estimated 1RM ~${Math.round(e1RM)} kg. ${nextMilestone[1]} kg on Wk ${nextMilestone[0]} is ambitious but keep the RPE honest — if sets feel like RPE 8+, don't force weight jumps.`);
            }

            if (plannedWeight && topWeight > 0) {
              if (topWeight >= plannedWeight) feedback.push(`✅ Bench weight on target (${topWeight} kg ≥ planned ${plannedWeight} kg). Execute the plan, don't improvise upward on a whim.`);
              else if (topWeight < plannedWeight * 0.95) feedback.push(`⚠️ Bench weight below plan (${topWeight} kg vs ${plannedWeight} kg planned). If RPE was high, this is useful data — the wave may need adjusting. If it was fatigue, prioritise sleep.`);
            }
          }

          // RPE analysis
          if (rpe !== null) {
            if (rpe >= 9) feedback.push(`⚠️ RPE ${rpe} — very hard session. If this was a planned intensity week, good. If not, watch recovery: the next session should feel easier or reduce load 5–10%.`);
            else if (rpe >= 7 && rpe <= 8) feedback.push(`✅ RPE ${rpe} — solid working session. This is the sweet spot for strength development in a hypertrophy/strength block.`);
            else if (rpe <= 5) feedback.push(`💡 RPE ${rpe} — session felt easy. Either this was a deload week (correct) or you have more in the tank. On non-deload weeks, add a set or push weight slightly.`);
          }

          // Sleep impact
          if (sleep !== null && sleep <= 5) feedback.push(`😴 Sleep score ${sleep}/10 — poor sleep blunts strength by up to 10%. If this is recurring, it's your biggest performance limiter. Don't push max weights on low sleep.`);

          // Week-specific advice
          const isDeloadWeek = [11,17].includes(wk);
          const isAttemptWeek = [12,18].includes(wk);
          if (isDeloadWeek) feedback.push(`🔽 Deload week — resist the urge to add volume. The goal is to arrive at next week's attempt feeling sharp, not tired. Less is more.`);
          if (isAttemptWeek) {
            const target = benchMilestones[wk];
            feedback.push(`🏋️ Attempt week! Target: ${target} kg. Warm up with singles at 60%, 75%, 85%, then go. One attempt only — don't grind a miss, it kills confidence.`);
          }

          if (nextMilestone && !isAttemptWeek) {
            const weeksOut = parseInt(nextMilestone[0]) - wk;
            feedback.push(`🎯 ${weeksOut} weeks to ${nextMilestone[1]} kg bench on Wk ${nextMilestone[0]}. Stay ambitious — Fergus would say: if the plan doesn't scare you slightly, it's not ambitious enough.`);
          }
        }

        // Sleep catch-all
        if (sleep !== null && sleep <= 4 && !feedback.some(f => f.includes('Sleep'))) {
          feedback.push(`😴 Sleep ${sleep}/10 is a red flag. Consider dropping intensity 10–15% today — training on poor sleep increases injury risk and blunts adaptation.`);
        }

        if (feedback.length === 0) feedback.push('📋 Log your sets, reps, weight and RPE to get specific coaching feedback.');

        // Build program suggestions
        const km = isRun ? (parseFloat(document.getElementById('runKm')?.value) || 0) : 0;
        const avgHR = isRun ? (parseInt(document.getElementById('avgHR')?.value) || 0) : 0;
        const exs = !isRun ? (window.getExercises ? window.getExercises() : []) : [];
        const suggestions = buildCoachSuggestions({ wk, dayKey: day.key, km, avgHR, rpe, planned, exs, sleep });
        window._pendingSuggestions = {};
        suggestions.forEach(s => { window._pendingSuggestions[s.id] = s; });

        const suggestionsHtml = suggestions.length > 0 ? `
          <div class="ai-suggestions">
            <div class="ai-suggest-header">💡 Program adjustments</div>
            ${suggestions.map(s => `
              <div class="ai-suggest-card" id="suggest-${s.id}">
                <div class="ai-suggest-label">${s.emoji} ${escapeHtml(s.label)}</div>
                <div class="ai-suggest-reason">${s.reason.split('\n').map(l => `<div style="margin-bottom:3px;">${escapeHtml(l)}</div>`).join('')}</div>
                <div class="ai-suggest-diff">
                  <span class="ai-diff-old">${escapeHtml((s.oldValue || '').split('\n')[0])}</span>
                  <span class="ai-diff-arrow">→</span>
                  <span class="ai-diff-new">${escapeHtml((s.newValue || '').split('\n')[0])}</span>
                </div>
                <button class="btn-secondary ai-apply-btn" data-sid="${s.id}">Apply to program</button>
              </div>
            `).join('')}
          </div>
        ` : '';

        document.getElementById('aiResponse').innerHTML = `
          <div class="card ai-card">
            <div class="ai-label">🧠 Coach Feedback — Wk ${wk}</div>
            <div class="ai-text">${feedback.map(f => `<div style="margin-bottom:10px;line-height:1.5;">${f}</div>`).join('')}</div>
            ${suggestionsHtml}
          </div>
        `;

        // Apply button handlers
        // Two-phase UX: optimistically show 'Saving…', await the override
        // commit, then mark applied. localStorage write is synchronous inside
        // applyProgramUpdate so the override is durable even if Supabase
        // fails — the load-time merge will reconcile it on next session.
        document.querySelectorAll('.ai-apply-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const sid = parseInt(btn.dataset.sid);
            const s = window._pendingSuggestions[sid];
            if (!s) return;
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Saving…';
            await applyProgramUpdate(s);
            const card = document.getElementById(`suggest-${sid}`);
            if (card) {
              btn.style.display = 'none';
              const badge = document.createElement('div');
              badge.className = 'ai-applied-badge';
              badge.textContent = '✓ Applied to Wk ' + s.week;
              card.appendChild(badge);
            }
            // Refresh whichever tab is currently displayed so the updated
            // plan (getPlanned reads the new override) is visible without
            // the user having to navigate away and back.
            try { render(); } catch (e) { console.warn('post-apply render skipped:', e); }
          });
        });
      });
    }

    // ── PR display helper: exercise card ──
    function renderExPRCard(key, exPRData) {
      const prs = exPRData[key];
      const loggedReps = Object.keys(prs).map(Number).sort((a,b)=>a-b);
      const bestE1RM = Math.max(...loggedReps.map(r => epley(prs[r].w, prs[r].r)));
      const ABBREVS = new Set(['bp','cgbp','rdl','tgu','db','bb','ez','oh','bw','hr','rpe','dl','hm','tt','lt','ltr']);
      const displayName = key.split(' ').map(word =>
        ABBREVS.has(word) ? word.toUpperCase() : word.charAt(0).toUpperCase() + word.slice(1)
      ).join(' ');
      const mostRecent = Object.values(prs).reduce((best, pr) => (!best || pr.date > best.date) ? pr : best, null);
      const recentCutoff = new Date(Date.now()-14*86400000).toISOString().slice(0,10);
      const recent = mostRecent?.date >= recentCutoff;
      return `
        <div class="card mb-12">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
            <div style="font-size:13px;font-weight:600;color:var(--accent);font-family:'DM Mono',monospace;">${escapeHtml(displayName)}</div>
            <div style="font-size:10px;color:var(--text-muted);font-family:'DM Mono',monospace;">est. 1RM ~${Math.round(bestE1RM)} kg</div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;">
            ${loggedReps.map(r => {
              const pr = prs[r];
              const isRecent = pr.date >= recentCutoff;
              return `
                <div style="background:var(--bg-card-alt);border-radius:6px;padding:6px 8px;text-align:center;${isRecent ? 'border:1px solid var(--gold);' : ''}">
                  <div style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;">${r}RM</div>
                  <div style="font-size:13px;font-weight:600;color:var(--text);font-family:'DM Mono',monospace;">${pr.w} kg</div>
                  ${pr.rpe ? `<div style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;">RPE ${pr.rpe}</div>` : ''}
                </div>
              `;
            }).join('')}
          </div>
          <div style="font-size:9px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-top:6px;">Wk ${mostRecent?.week || '?'} · ${recent ? '<span style=\"color:var(--gold)\">✦ recent</span>' : (mostRecent?.date || '')}</div>
        </div>
      `;
    }

    function renderPRs() {
      const runFields = [
        { key: 'km1', label: '1 km' },
        { key: 'mile', label: '1 Mile' },
        { key: '5k', label: '5K' },
        { key: '10k', label: '10K' },
        { key: 'hm', label: 'Half Marathon' },
        { key: 'marathon', label: 'Marathon' },
      ];
      const strFields = [
        { key: 'bench', label: 'Bench Press' },
        { key: 'squat', label: 'Back Squat' },
        { key: 'deadlift', label: 'Deadlift' },
      ];

      // Keywords that classify an exercise as a compound lift
      const COMPOUND_KEYWORDS = [
        'bench','squat','deadlift','sumo','press','row','pull-up','pullup','pull up',
        'chin','dip','lunge','hip thrust','rdl','romanian','overhead','ohp','incline',
        'decline','barbell','trap bar','leg press','hack squat','front squat'
      ];
      function isCompound(key) {
        return COMPOUND_KEYWORDS.some(kw => key.includes(kw));
      }

      const exPRData = state.exercisePRs || {};
      const exNames = Object.keys(exPRData).filter(k => Object.keys(exPRData[k]).length > 0);
      const compounds = exNames.filter(k => isCompound(k)).sort();
      const others = exNames.filter(k => !isCompound(k)).sort();

      let html = `
        <div class="prs-header">
          <div class="section-header mb-0">Personal Records</div>
          <button class="edit-btn ${state.editingPRs ? 'active' : ''}" id="toggleEdit">
            ${state.editingPRs ? 'Save' : 'Edit'}
          </button>
        </div>

        <div class="card mb-12">
          <div class="pr-row">
            <span class="pr-label">Body Weight</span>
            ${state.editingPRs
              ? `<input type="text" class="form-input pr-input" id="bodyWeightInput" value="${state.bodyWeight}" placeholder="e.g. 82 kg">`
              : `<span class="pr-value-display accent">${state.bodyWeight || '—'}</span>`
            }
          </div>
        </div>

        <!-- RUNNING -->
        <div class="section-header">🏃 Running</div>
        <div class="historical-note" style="margin-top:0;margin-bottom:10px;">
          <span class="historical-flag">⚑ Historical</span> — PRs set 10+ years ago. Paces are based on current fitness. Update as new times come in.
        </div>
        <div class="card mb-12">
          ${runFields.map(f => `
            <div class="pr-row">
              <span class="pr-label">${f.label}</span>
              ${state.editingPRs
                ? `<input type="text" class="form-input pr-input" data-run-pr="${f.key}" value="${state.runPRs[f.key] || ''}">`
                : `<span class="pr-value-display accent">${state.runPRs[f.key] || '—'}</span>`
              }
            </div>
          `).join('')}
        </div>

        <!-- COMPOUND LIFTS -->
        <div class="section-header">🏋 Compound Lifts</div>
        <div class="card mb-12">
          <div style="font-size:10px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-bottom:8px;">Goal PRs — edit to update</div>
          ${strFields.map(f => `
            <div class="pr-row">
              <span class="pr-label">${f.label}</span>
              ${state.editingPRs
                ? `<input type="text" class="form-input pr-input" data-pr="${f.key}" value="${state.prs[f.key] || ''}">`
                : `<span class="pr-value-display gold">${state.prs[f.key] || '—'}</span>`
              }
            </div>
          `).join('')}
        </div>
      `;

      if (compounds.length > 0) {
        html += `<div style="font-size:10px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-bottom:10px;line-height:1.5;">Best weight logged per rep count · est. 1RM via Epley · auto-detected on save</div>`;
        compounds.forEach(key => { html += renderExPRCard(key, exPRData); });
      }

      if (others.length > 0) {
        html += `<div class="section-header" style="margin-top:16px;">💪 Accessories</div>`;
        html += `<div style="font-size:10px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-bottom:10px;line-height:1.5;">Best weight logged per rep count · est. 1RM via Epley · auto-detected on save</div>`;
        others.forEach(key => { html += renderExPRCard(key, exPRData); });
      }

      document.getElementById('prs-tab').innerHTML = html;

      document.getElementById('toggleEdit').addEventListener('click', async () => {
        if (state.editingPRs) {
          // Save
          const bwInput = document.getElementById('bodyWeightInput');
          if (bwInput) state.bodyWeight = bwInput.value;
          
          document.querySelectorAll('[data-pr]').forEach(input => {
            state.prs[input.dataset.pr] = input.value;
          });
          document.querySelectorAll('[data-run-pr]').forEach(input => {
            state.runPRs[input.dataset.runPr] = input.value;
          });
          
          await saveState();
        }
        state.editingPRs = !state.editingPRs;
        renderPRs();
      });
    }

                  <div>
                    <div style="color:var(--text);margin-bottom:2px;">${escapeHtml(o.label || '')}</div>
                    <div style="color:var(--text-muted);font-size:10px;">Wk ${o.week} · ${new Date(o.ts).toLocaleDateString('en-GB', {day:'numeric',month:'short'})}</div>
                  </div>
                  ${idx === 0 ? '<span style="font-size:10px;color:var(--accent);font-family:monospace;">← latest</span>' : ''}
                </div>
              `).join('')}
            </div>
            <button class="btn-secondary" id="undoUpdateBtn" style="color:var(--tag-red);">↩ Undo last update</button>
          `}
        </div>

      `;

      // Upload pending button
      const uploadBtn = document.getElementById('uploadPendingBtn');
      if (uploadBtn) {
        updateSyncBadge(); // set initial state
        uploadBtn.addEventListener('click', async () => {
          uploadBtn.textContent = 'Uploading…';
          uploadBtn.disabled = true;
          const remaining = await flushQueue();
          const statusDiv = document.getElementById('uploadStatus');
          if (remaining === 0) {
            statusDiv.textContent = '✓ All sessions synced to Supabase';
            statusDiv.style.color = 'var(--success)';
          } else {
            statusDiv.textContent = `⚠ ${remaining} session(s) still pending — check connection`;
            statusDiv.style.color = 'var(--tag-red)';
          }
          statusDiv.style.display = 'block';
          updateSyncBadge();
        });
      }

      const undoBtn = document.getElementById('undoUpdateBtn');
      if (undoBtn) {
        undoBtn.addEventListener('click', () => {
          const didUndo = undoLastProgramUpdate();
          if (didUndo) {
            renderSettings();
            // Refresh home if visible
            if (state.tab === 'home') renderHome();
          }
        });
      }

      document.getElementById('signOutBtn').addEventListener('click', async () => {
        await sb.auth.signOut();
      });


    }
    // ═══════════════════════════════════════════════════════════════
    function initApp() {
      // Wire the coach overlay (idempotent).
      wireCoachControls();

      // Apply theme
      document.body.dataset.theme = state.theme;
      document.getElementById('themeToggle').textContent = state.theme === 'light' ? '☽ Dark' : '☀ Light';
      setSyncDot('synced');

      // Theme toggle
      document.getElementById('themeToggle').addEventListener('click', async () => {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        document.body.dataset.theme = state.theme;
        document.getElementById('themeToggle').textContent = state.theme === 'light' ? '☽ Dark' : '☀ Light';
        document.querySelector('meta[name="theme-color"]').content = state.theme === 'light' ? '#f7f4ef' : '#0f0d0a';
        await saveState();
      });

      // Tab navigation
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
          state.tab = tab.dataset.tab;
          if (state.tab === 'program') state.programView = 'weeks';
          render();
        });
      });

      render();
    }

    let _loginScreenBound = false;
    function showLoginScreen() {
      document.getElementById('loginScreen').style.display = 'flex';
      if (_loginScreenBound) return;
      _loginScreenBound = true;
      let isSignUp = false;

      document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');
        const errDiv = document.getElementById('loginError');
        errDiv.style.display = 'none';
        btn.disabled = true;
        btn.textContent = isSignUp ? 'Creating account…' : 'Signing in…';

        let result;
        if (isSignUp) {
          result = await sb.auth.signUp({ email, password });
        } else {
          result = await sb.auth.signInWithPassword({ email, password });
        }

        if (result.error) {
          errDiv.textContent = result.error.message;
          errDiv.style.display = 'block';
          btn.disabled = false;
          btn.textContent = isSignUp ? 'Create Account' : 'Sign In';
        }
        // Success: onAuthStateChange will handle the rest
      });

      document.getElementById('loginToggle').addEventListener('click', () => {
        isSignUp = !isSignUp;
        document.getElementById('loginBtn').textContent = isSignUp ? 'Create Account' : 'Sign In';
        document.getElementById('loginToggle').textContent = isSignUp ? 'Already have an account? Sign in' : 'No account yet? Sign up';
        document.getElementById('loginError').style.display = 'none';
      });

      // Allow Enter key
      ['loginEmail','loginPassword'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
          if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
      });
    }

    function render() {
      const tabId = `${state.tab}-tab`;
      const renderFn = { home: renderHome, program: renderProgram, prs: renderPRs, settings: renderSettings }[state.tab];
      if (!renderFn) return;
      try {
        renderFn();
      } catch(e) {
        console.error('Render error on tab "' + state.tab + '":', e);
        const el = document.getElementById(tabId);
        if (el) el.innerHTML = `<div style="padding:20px;font-family:'DM Mono',monospace;font-size:12px;color:var(--tag-red);line-height:1.7;">
          ⚠ Something went wrong rendering this tab.<br><br>
          <span style="color:var(--text-muted);font-size:11px;">${escapeHtml(e?.message || 'Unknown error')}</span><br><br>
          <button onclick="render()" style="padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;">Retry</button>
        </div>`;
      }
    }

    // ── Auth entry point ──
    document.addEventListener('DOMContentLoaded', async () => {
      showLoginScreen();

      let appStarted = false;

      async function startApp(user) {
        if (appStarted) return;
        currentUser = user;
        try { await loadProfile(); } catch(e) { console.warn('loadProfile error (non-fatal):', e); }
        try {
          document.getElementById('loginScreen').style.display = 'none';
          initApp();
          appStarted = true; // only set after successful init
        } catch(e) {
          console.error('initApp failed:', e);
          currentUser = null;
          document.getElementById('loginScreen').style.display = 'flex';
        }
      }

      // Fast path: restore existing session immediately (avoids hanging on onAuthStateChange)
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session?.user) await startApp(session.user);
      } catch(e) {
        console.warn('getSession failed:', e);
      }

      // Timeout fallback: if nothing happened in 6 s, show login cleanly
      setTimeout(() => {
        if (!appStarted) {
          document.getElementById('loginScreen').style.display = 'flex';
        }
      }, 6000);

      // Ongoing listener: handles sign-in, token refresh, sign-out
      sb.auth.onAuthStateChange(async (event, session) => {
        if (session?.user) {
          if (!appStarted) {
            await startApp(session.user);
          } else {
            currentUser = session.user; // token refreshed silently
          }
        } else {
          currentUser = null;
          if (appStarted) {
            // Session expired — show login without full reload
            document.getElementById('loginScreen').style.display = 'flex';
          }
        }
      });
    });
  </script>
</body>
</html>
