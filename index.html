  "Coming next: add a race (5K/10K/HM/marathon/ultra), free-form sparring online.";


    // ── Persistence ────────────────────────────────────────────────
    function persistCoachConversation() {
      try {
        localStorage.setItem('coachConversation', JSON.stringify(state.coachConversation));
      } catch (e) { console.warn('coach persistence failed:', e); }
    }

    function addCoachMessage(role, text, changes, extras) {
      const msgId = 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
      const msg = { id: msgId, ts: new Date().toISOString(), role, text: text || '' };
      if (Array.isArray(changes) && changes.length > 0) {
        msg.changes = changes.map(c => ({ ...c, sourceMsgId: msgId }));
        msg.statuses = {};
        msg.changes.forEach(c => { msg.statuses[c.changeId] = 'pending'; });
      }
      // v1.05: clarification carries sub-questions and the params needed to
      // resume planning once all sub-questions are answered.
      if (extras && Array.isArray(extras.clarifications) && extras.clarifications.length > 0) {
        msg.clarifications = extras.clarifications;
        msg.pendingResume = extras.pendingResume || null;
        msg.resumed = false;
      }
      state.coachConversation.push(msg);
      // Cap to last 50 messages so localStorage doesn't grow unbounded.
      if (state.coachConversation.length > 50) {
        state.coachConversation = state.coachConversation.slice(-50);
      }
      persistCoachConversation();
      renderCoachChat();
      return msg;
    }

    function clearCoachConversation() {
      state.coachConversation = [];
      persistCoachConversation();
      renderCoachChat();
    }

    // ── Render ─────────────────────────────────────────────────────
    function renderCoachChat() {
      const container = document.getElementById('coachMessages');
      if (!container) return;
      if (state.coachConversation.length === 0) {
        container.innerHTML = renderCoachEmptyState();
        bindCoachEmptyExamples();
        return;
      }
      // Group into turn pairs (user, coach) so each exchange stays intact, then
      // reverse the pairs — newest pair renders first (directly under the input
      // bar, which now sits at the top). Within each pair, user→coach order is
      // preserved. See v1.04 note for the iOS bottom dead-zone rationale.
      const conv = state.coachConversation;
      const pairs = [];
      for (let i = 0; i < conv.length; i += 2) {
        const pair = [conv[i], conv[i + 1]].filter(Boolean);
        pairs.push(pair);
      }
      pairs.reverse();
      container.innerHTML = pairs
        .map(pair => pair.map(renderCoachMessage).join(''))
        .join('');
      bindCoachChangeCardEvents();
      // Newest is now at the top; reset scroll so it's the first thing seen.
      container.scrollTop = 0;
    }

    function renderCoachMessage(msg) {
      if (msg.role === 'user') {
        return `
          <div class="coach-msg coach-msg-user">
            <div class="bubble">${escapeHtml(msg.text)}</div>
          </div>
        `;
      }
      // coach
      const isError = msg.isError;
      const changesHtml = (msg.changes && msg.changes.length > 0)
        ? msg.changes.map(c => renderChangeCard(c, msg)).join('')
        : '';
      const clarifyHtml = (msg.clarifications && msg.clarifications.length > 0)
        ? renderClarifyCard(msg)
        : '';
      return `
        <div class="coach-msg coach-msg-coach">
          <div class="meta">
            <span class="meta-emoji">🧠</span>
            <span class="meta-label">Coach</span>
          </div>
          <div class="bubble ${isError ? 'error' : ''}">${escapeHtml(msg.text)}</div>
          ${changesHtml}
          ${clarifyHtml}
        </div>
      `;
    }

    // v1.05 — clarification card with per-question option chips + Confirm.
    function renderClarifyCard(msg) {
      const resumed = msg.resumed === true;
      const allAnswered = msg.clarifications.every(c => c.chosen);
      const blocks = msg.clarifications.map((c, qi) => {
        const opts = c.options.map((o, oi) => {
          const chosen = c.chosen === o.key;
          return `<button class="ccx-opt${chosen ? ' chosen' : ''}" data-mid="${msg.id}" data-qi="${qi}" data-okey="${o.key}"${resumed ? ' disabled' : ''}>${escapeHtml(o.label)}</button>`;
        }).join('');
        return `
          <div class="ccx-q">${escapeHtml(c.question)}</div>
          <div class="ccx-options">${opts}</div>`;
      }).join('');
      const confirmBtn = `<button class="ccx-confirm" data-mid="${msg.id}"${(!allAnswered || resumed) ? ' disabled' : ''}>Confirm</button>`;
      return `<div class="coach-clarify${resumed ? ' resumed' : ''}">${blocks}${confirmBtn}</div>`;
    }

    function renderChangeCard(change, msg) {
      const status = msg.statuses?.[change.changeId] || 'pending';
      const kindEmoji = {
        text_replace:       '🏋',
        session_day_shift:  '📅',
        session_swap:       '🔁',
        session_scale:      '📊',
        block_scale:        '📊',
        week_replace:       '📝',
        goal_set:           '🎯',
        discipline_focus:   '🎯'
      }[change.kind] || '·';
      let diffHtml = '';
      if (change.kind === 'text_replace' && change.payload) {
        const o = (change.payload.oldValue || '').split('\n');
        const n = (change.payload.newValue || '').split('\n');
        const rows = [];
        const max = Math.max(o.length, n.length);
        for (let i = 0; i < max; i++) {
          if (o[i] === n[i]) continue; // skip unchanged lines
          if (o[i]) rows.push(`<div class="old">− ${escapeHtml(o[i])}</div>`);
          if (n[i]) rows.push(`<div class="new">+ ${escapeHtml(n[i])}</div>`);
        }
        if (rows.length === 0 && change.payload.newValue) {
          rows.push(`<div class="new">${escapeHtml(change.payload.newValue.split('\n')[0])}</div>`);
        }
        diffHtml = `<div class="cc-diff">${rows.join('')}</div>`;
      } else if (change.kind === 'session_day_shift' && change.payload) {
        const from = DOW_LABEL_FULL[change.payload.fromDow] || '?';
        const to   = DOW_LABEL_FULL[change.payload.toDow]   || '?';
        diffHtml = `<div class="cc-diff"><span class="old">− ${escapeHtml(from)}</span> <span class="new">+ ${escapeHtml(to)}</span></div>`;
      } else if (change.kind === 'session_swap' && change.payload) {
        diffHtml = `<div class="cc-diff"><span class="new">${escapeHtml(SESSION_KEY_LABEL[change.payload.sessionA])} ↔ ${escapeHtml(SESSION_KEY_LABEL[change.payload.sessionB])}</span></div>`;
      }

      // v1.06 — Crawley violation surface (warning banner + optional fix).
      const violations = Array.isArray(change.violations) ? change.violations : [];
      const firstWithFix = violations.find(v => Array.isArray(v.fix) && v.fix.length > 0);
      const fixExpanded  = change.fixExpanded === true;
      let warningHtml = '';
      if (violations.length > 0 && status !== 'applied' && status !== 'skipped') {
        const msgsHtml = violations.map(v =>
          `<div class="cc-warn-title">⚠ ${escapeHtml(v.principleName)}</div>
           <div class="cc-warn-msg">${escapeHtml(v.message)}</div>`
        ).join('');
        const toggleBtn = firstWithFix
          ? `<button class="cc-fix-toggle" data-mid="${msg.id}" data-cid="${change.changeId}" data-action="${fixExpanded ? 'hide' : 'show'}">${fixExpanded ? '× Hide fix' : '✓ Show fix'}</button>`
          : '';
        const fixDetailHtml = (fixExpanded && firstWithFix)
          ? `<div class="cc-fix-detail">
               <div class="cc-fix-desc">${escapeHtml(firstWithFix.fixDescription || 'Proposed fix:')}</div>
               ${firstWithFix.fix.map(fc =>
                 `<div class="cc-fix-row"><span class="cc-fix-label">${escapeHtml(fc.label || fc.kind)}</span></div>`
               ).join('')}
             </div>`
          : '';
        warningHtml = `<div class="cc-warning">${msgsHtml}${toggleBtn}${fixDetailHtml}</div>`;
      }

      // Action buttons depend on state. When fix is revealed, the user gets
      // two apply paths (with fix vs original only). Otherwise a plain Apply.
      let actions;
      if (status === 'applied') {
        actions = `<div class="cc-badge applied">✓ Applied</div>`;
      } else if (status === 'skipped') {
        actions = `<div class="cc-badge skipped">Skipped</div>`;
      } else if (fixExpanded && firstWithFix) {
        actions = `
          <button class="cc-apply-with-fix" data-mid="${msg.id}" data-cid="${change.changeId}">Apply with fix</button>
          <button class="cc-apply" data-mid="${msg.id}" data-cid="${change.changeId}">Apply original only</button>
          <button class="cc-skip"  data-mid="${msg.id}" data-cid="${change.changeId}">Skip</button>`;
      } else {
        actions = `
          <button class="cc-apply" data-mid="${msg.id}" data-cid="${change.changeId}">Apply</button>
          <button class="cc-skip"  data-mid="${msg.id}" data-cid="${change.changeId}">Skip</button>`;
      }
      return `
        <div class="coach-change-card" data-cid="${change.changeId}">
          <div class="cc-head">
            <span class="cc-kind">${kindEmoji}</span>
            <span class="cc-label">${escapeHtml(change.label || change.kind)}</span>
          </div>
          ${change.rationale ? `<div class="cc-rationale">${escapeHtml(change.rationale)}</div>` : ''}
          ${diffHtml}
          ${warningHtml}
          <div class="cc-actions">${actions}</div>
        </div>
      `;
    }

    // ── Apply / Skip ───────────────────────────────────────────────
    function bindCoachChangeCardEvents() {
      document.querySelectorAll('.coach-change-card .cc-apply').forEach(btn => {
        btn.addEventListener('click', async () => {
          await coachApplyChange(btn.dataset.mid, btn.dataset.cid);
        });
      });
      document.querySelectorAll('.coach-change-card .cc-skip').forEach(btn => {
        btn.addEventListener('click', () => {
          coachSkipChange(btn.dataset.mid, btn.dataset.cid);
        });
      });
      // v1.06 — Crawley violation surface: fix toggle + apply-with-fix.
      document.querySelectorAll('.coach-change-card .cc-fix-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const msg = state.coachConversation.find(m => m.id === btn.dataset.mid);
          if (!msg || !msg.changes) return;
          const change = msg.changes.find(c => c.changeId === btn.dataset.cid);
          if (!change) return;
          change.fixExpanded = btn.dataset.action === 'show';
          persistCoachConversation();
          renderCoachChat();
        });
      });
      document.querySelectorAll('.coach-change-card .cc-apply-with-fix').forEach(btn => {
        btn.addEventListener('click', async () => {
          await coachApplyChangeWithFix(btn.dataset.mid, btn.dataset.cid);
        });
      });
      // v1.05: clarification option buttons + Confirm
      document.querySelectorAll('.coach-clarify .ccx-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const msg = state.coachConversation.find(m => m.id === btn.dataset.mid);
          if (!msg || msg.resumed) return;
          const qi = parseInt(btn.dataset.qi, 10);
          if (!msg.clarifications[qi]) return;
          msg.clarifications[qi].chosen = btn.dataset.okey;
          persistCoachConversation();
          renderCoachChat();
        });
      });
      document.querySelectorAll('.coach-clarify .ccx-confirm').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          coachResumeAnchorGoal(btn.dataset.mid);
        });

    // v1.06 — apply original + all fix changes from the first violation that
    // has a fix. Each apply is its own override on the stack (so undo pops them
    // one at a time — acceptable cost for v1.06; could group-undo in 2.3).
    async function coachApplyChangeWithFix(msgId, changeId) {
      const msg = state.coachConversation.find(m => m.id === msgId);
      if (!msg || !msg.changes) return;
      const change = msg.changes.find(c => c.changeId === changeId);
      if (!change) return;
      const btn = document.querySelector(`.cc-apply-with-fix[data-mid="${msgId}"][data-cid="${changeId}"]`);
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      await applyProgramUpdate(change);
      const firstWithFix = (change.violations || []).find(v => Array.isArray(v.fix) && v.fix.length > 0);
      if (firstWithFix) {
        for (const fc of firstWithFix.fix) {
          await applyProgramUpdate(fc);
        }
      }
      msg.statuses[changeId] = 'applied';
      persistCoachConversation();
      renderCoachChat();
      try { if (typeof render === 'function') render(); } catch {}
    }

    async function coachApplyChange(msgId, changeId) {
      const msg = state.coachConversation.find(m => m.id === msgId);
      if (!msg || !msg.changes) return;
      const change = msg.changes.find(c => c.changeId === changeId);
      if (!change) return;
      // Optimistic UI: disable + label "Saving…"
      const btn = document.querySelector(`.cc-apply[data-mid="${msgId}"][data-cid="${changeId}"]`);
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
      await applyProgramUpdate(change);
      msg.statuses[changeId] = 'applied';
      persistCoachConversation();
      renderCoachChat();
      // Background: refresh underlying tab so program reflects the change.
      try { if (typeof render === 'function') render(); } catch {}
    }

    function coachSkipChange(msgId, changeId) {
      const msg = state.coachConversation.find(m => m.id === msgId);
      if (!msg) return;
      msg.statuses[changeId] = 'skipped';
      persistCoachConversation();
      renderCoachChat();
    }

    // ── Open / close / send ────────────────────────────────────────
    function openCoachScreen() {
      const screen = document.getElementById('coachScreen');
      if (!screen) return;
      screen.classList.add('open');
      renderCoachChat();

      document.getElementById('coachScreen')?.classList.remove('open');

    function handleCoachSend() {
      const inp = document.getElementById('coachInput');
      if (!inp) return;
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';
      addCoachMessage('user', text);
      const currentWk = getCurrentWeek();
      const parsed = parseCoachIntent(text, currentWk);
      const result = planForIntent(parsed, currentWk);
      if (result.error) {
        const errMsg = addCoachMessage('coach', result.error);
        errMsg.isError = true;
        persistCoachConversation();
        renderCoachChat();
        return;
      }
      // v1.05: planners may return clarifications instead of changes when a
      // cascade decision is needed. Both can also be empty (just a message).
      addCoachMessage('coach', result.message || '', result.changes, {
        clarifications: result.clarifications,
        pendingResume: result.pendingResume
      });
    }

    // One-time wiring for the coach overlay controls. Called from initApp().
    let _coachWired = false;
    function wireCoachControls() {
      if (_coachWired) return;
      _coachWired = true;
      document.getElementById('coachBack')?.addEventListener('click', closeCoachScreen);
      document.getElementById('coachClear')?.addEventListener('click', () => {
        if (state.coachConversation.length === 0) return;
        if (confirm('Clear the coach conversation? Applied program changes remain in your program — only the chat history is wiped.')) {
          clearCoachConversation();
        }
      });
      document.getElementById('coachSend')?.addEventListener('click', handleCoachSend);
      document.getElementById('coachInput')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); handleCoachSend(); }
      });
    }

    // ── Exercise PR helpers ──
    function exPRKey(name) {
      return (name || '').toLowerCase().trim().replace(/\s+/g, ' ');
    }

    function epley(weight, reps) {
      if (!weight || !reps || reps <= 0) return 0;
      if (reps === 1) return weight;
      return weight * (1 + reps / 30);
    }

    function suggestWeight(e1rm, targetReps) {
      if (!e1rm || e1rm <= 0 || !targetReps || targetReps <= 0) return null;
      const raw = e1rm / (1 + targetReps / 30);
      return Math.round(raw / 2.5) * 2.5;
    }

    // ── Plan-target parsing ──────────────────────────────────────────────
    // Convert a plan's targetWeight string ("100 kg", "65%", "25–30 kg", "BW+5")
    // into a single concrete number ONLY when unambiguous. Returns null for
    // ranges, percentages, bodyweight notations, or anything we can't safely
    // commit to a log. Conservative on purpose: preloading the wrong number
    // is worse than not preloading.
    function parseWeightTarget(str) {
      if (str == null) return null;
      const s = String(str).trim();
      if (!s) return null;
      if (/%/.test(s)) return null;                 // 65% → needs e1rm calc
      if (/bw/i.test(s)) return null;               // BW, BW+5 → bodyweight
      if (/[–—]/.test(s)) return null;              // en/em-dash ranges
      // hyphen range like "25-30 kg" but not a leading minus
      if (/\d\s*-\s*\d/.test(s)) return null;
      const m = s.match(/^(\d+(?:\.\d+)?)\s*(?:kg)?$/i);
      return m ? parseFloat(m[1]) : null;
    }

    // Convert a plan's targetReps ("8", "6-8", "6–8") into a single number
    // ONLY when unambiguous. Returns null for ranges.
    function parseRepsTarget(str) {
      if (str == null) return null;
      const s = String(str).trim();
      if (!s) return null;
      if (/[–—]/.test(s)) return null;
      if (/\d\s*-\s*\d/.test(s)) return null;
      const m = s.match(/^(\d+)$/);
      return m ? parseInt(m[1], 10) : null;
    }

    // ── HR zones (configurable, derived from state.hrConfig) ────────────
    // Default %-anchors come from the standard 5-zone polarised model the
    // app shipped with. zoneBoundaries lets the user pin specific bpm
    // ceilings (e.g. after a lactate-threshold or critical-power test).
    function getHRZones() {
      const cfg = state.hrConfig || { maxHR: 183, zoneBoundaries: null };
      const m = Math.max(120, Math.min(230, parseInt(cfg.maxHR, 10) || 183));
      const def = {
        z1Low:  Math.round(m * 0.55),
        z1High: Math.round(m * 0.65),
        z2High: Math.round(m * 0.75),
        z3High: Math.round(m * 0.85),
        z4High: Math.round(m * 0.92),
        z5High: m
      };
      const ov = cfg.zoneBoundaries || {};
      const eff = {
        z1Low:  Number.isFinite(ov.z1Low)  ? ov.z1Low  : def.z1Low,
        z1High: Number.isFinite(ov.z1High) ? ov.z1High : def.z1High,
        z2High: Number.isFinite(ov.z2High) ? ov.z2High : def.z2High,
        z3High: Number.isFinite(ov.z3High) ? ov.z3High : def.z3High,
        z4High: Number.isFinite(ov.z4High) ? ov.z4High : def.z4High,
        z5High: Number.isFinite(ov.z5High) ? ov.z5High : def.z5High
      };
      return [
        { zone: 'Z1', name: 'Recovery',  low: eff.z1Low,  high: eff.z1High, pct: '55–65%',  bar: 55,  color: '#3cb87a', use: 'Warm-up / cool-down / shake-out' },
        { zone: 'Z2', name: 'Aerobic',   low: eff.z1High, high: eff.z2High, pct: '65–75%',  bar: 70,  color: '#4a7fd4', use: 'Easy + Long runs ← TARGET' },
        { zone: 'Z3', name: 'Tempo',     low: eff.z2High, high: eff.z3High, pct: '75–85%',  bar: 82,  color: '#f0c040', use: 'Marathon pace / LR finishers' },
        { zone: 'Z4', name: 'Threshold', low: eff.z3High, high: eff.z4High, pct: '85–92%',  bar: 91,  color: '#e67e22', use: 'Tempo / HM pace / quality' },
        { zone: 'Z5', name: 'VO2max',    low: eff.z4High, high: eff.z5High, pct: '92–100%', bar: 100, color: '#c0392b', use: 'Hard reps / TT / race' }
      ];
    }
    function getMaxHR() { return getHRZones()[4].high; }
    function getZ2Range() { const z = getHRZones()[1]; return { low: z.low, high: z.high }; }

    function persistHRConfig() {
      localStorage.setItem('hrConfig', JSON.stringify(state.hrConfig));
      // Best-effort cloud sync; tolerant of column-not-exist.
      syncExtrasSilent();
    }

    // ── Milestones (configurable, default seeded from MILESTONES constant) ──
    function getMilestones() {
      if (!Array.isArray(state.milestones)) {
        // Seed once from the bundled default if nothing user-defined yet.
        state.milestones = MILESTONES.slice();
        localStorage.setItem('milestones', JSON.stringify(state.milestones));
      }
      return state.milestones;
    }
    function persistMilestones() {
      localStorage.setItem('milestones', JSON.stringify(state.milestones));
      syncExtrasSilent();
    }

    // Best-effort cloud sync for fields whose columns may not exist yet on
    // the profiles table. Failures are non-fatal (localStorage is canonical).
    async function syncExtrasSilent() {
      if (!currentUser) return;
      try {
        await sb.from('profiles').update({
          hr_config: state.hrConfig,
          milestones: state.milestones,
          updated_at: new Date().toISOString()
        }).eq('id', currentUser.id);
      } catch (e) {
        // Most likely PGRST204 (column not found) until the user adds the
        // columns. Safe to ignore — local copy is authoritative.
      }
    }


    function getBestE1RM(exName) {
      const key = exPRKey(exName);
      const prs = state.exercisePRs?.[key];
      if (!prs) return null;
      let best = 0;
      Object.values(prs).forEach(pr => {
        const e = epley(pr.w, pr.r);
        if (e > best) best = e;
      });
      return best > 0 ? best : null;
    }

    function getExerciseSuggestion(exName, targetReps) {
      const key = exPRKey(exName);
      const prs = state.exercisePRs?.[key];
      if (!prs || Object.keys(prs).length === 0) return null;

      const e1rm = getBestE1RM(exName);
      if (!e1rm) return null;

      // find the most recent log for context label
      let lastPR = null;
      Object.values(prs).forEach(pr => {
        if (!lastPR || pr.date > lastPR.date) lastPR = pr;
      });

      const suggested = targetReps ? suggestWeight(e1rm, targetReps) : null;
      return { e1rm: Math.round(e1rm * 10) / 10, suggested, last: lastPR };
    }

    // Returns array of new PR objects { exName, reps, weight, prev }
    function updateExercisePRs(exercises, weekNum) {
      const newPRs = [];
      if (!state.exercisePRs) state.exercisePRs = {};

      exercises.forEach(ex => {
        if (!ex.name || !ex.sets) return;
        const key = exPRKey(ex.name);
        if (!state.exercisePRs[key]) state.exercisePRs[key] = {};

        ex.sets.forEach(s => {
          const w = parseFloat(s.weight);
          const r = parseInt(s.reps);
          if (!w || !r || w <= 0 || r <= 0 || r > 20) return;

          const rStr = String(r);
          const existing = state.exercisePRs[key][rStr];
          const isNewPR = !existing || w > existing.w;

          if (isNewPR) {
            const prev = existing ? existing.w : null;
            state.exercisePRs[key][rStr] = {
              w, r,
              rpe: parseFloat(s.rpe) || null,
              date: new Date().toISOString().slice(0, 10),
              week: weekNum
            };
            newPRs.push({ exName: ex.name, reps: r, weight: w, prev });
          }
        });
      });

      localStorage.setItem('exercisePRs', JSON.stringify(state.exercisePRs));
      return newPRs;
    }

    function daysUntil(dateStr) {
      const now = new Date(); now.setHours(0,0,0,0);
      return Math.ceil((new Date(dateStr) - now) / 86400000);
    }

    function getCurrentWeek() {
      const now = new Date(); now.setHours(0,0,0,0);
      const diff = Math.floor((now - PLAN_START) / 86400000);
      return Math.max(1, Math.min(32, Math.floor(diff / 7) + 1));
    }

    function getPhase(wk) {
      return PHASE_INFO.find(p => p.weeks.includes(wk)) || PHASE_INFO[0];
    }

    function getWeekCompletion(wk) {
      const total = SESSION_DAYS.filter(d => getPlanned(wk, d.key)).length;
      const done = SESSION_DAYS.filter(d => getPlanned(wk, d.key) && state.completedSessions[`${wk}_${d.key}`]).length;
      return { done, total };
    }

    function isRunSession(key) {
      return ['easy', 'quality', 'longRun'].includes(key);
    }

    // Parse exercises from planned workout text
    // Format: "Flat BP  3×3 @100 kg" or "Back Squat  4×6–8 @65–70%"
    function parseExercisesFromPlan(planText) {
      if (!planText) return [];
      
      const lines = planText.split('\n').filter(line => line.trim());
      const exercises = [];
      
      for (const line of lines) {
        // Skip lines that are clearly not exercises (HR cues, inline notes)
        if (line.includes('❤️') || line.includes('Zone') || line.startsWith('(')) continue;
        // Skip any line that has no sets notation at all — pace/jog/rest cues have no "NxN" pattern
        if (!line.match(/\d+[×x]\d+/)) continue;
        
        // Try to parse exercise format: "Exercise Name  SxR @Weight"
        // Match patterns like "3×3", "4×6–8", "3×10", "2×3 each side"
        const setsMatch = line.match(/(\d+)[×x](\d+)(?:–(\d+))?/);
        
        if (setsMatch) {
          const numSets = parseInt(setsMatch[1]);
          const targetReps = setsMatch[3] ? `${setsMatch[2]}-${setsMatch[3]}` : setsMatch[2];
          
          // Extract exercise name (everything before the sets notation)
          const nameMatch = line.match(/^(.+?)\s+\d+[×x]/);
          const name = nameMatch ? nameMatch[1].trim() : line.split(/\d+[×x]/)[0].trim();
          
          // Extract target weight if present (@100 kg, @65%, @25–30 kg)
          const weightMatch = line.match(/@([\d–\.]+\s*(?:kg|%)?)/);
          const targetWeight = weightMatch ? weightMatch[1].trim() : '';
          
          // Extract any notes in parentheses
          const notesMatch = line.match(/\(([^)]+)\)/);
          const exerciseNotes = notesMatch ? notesMatch[1] : '';
          
          // Create sets array
          const sets = [];
          for (let i = 0; i < numSets; i++) {
            sets.push({
              targetReps: targetReps,
              targetWeight: targetWeight,
              reps: '',
              weight: '',
              rpe: ''
            });
          }
          
          exercises.push({
            name: name,
            notes: exerciseNotes,
            sets: sets
          });
        }
      }
      
      return exercises;
    }

    function formatSessionContent(content, color) {
      if (!content) return '<span style="color:var(--text-muted);font-style:italic;">—</span>';
      return content.split('\n').map(line => {
        const isBig = line.includes('BENCH ATTEMPT') || line.includes('MARATHON') || line.includes('TIME TRIAL') || line.includes('TT —') || line.includes('RACE DAY');
        const isHR = line.includes('❤️') || line.includes('Zone');
        let style = '';
        if (isBig) style = `color:${color};font-weight:700;`;
        else if (isHR) style = 'color:var(--tag-red);';
        return `<div style="${style}">${escapeHtml(line)}</div>`;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

            <div class="today-right">
              <div class="today-week">Wk ${wk} · ${WEEKS[wk]?.dates || ''}</div>
              <div class="today-phase">${phase.label.split('—')[1]?.trim() || phase.label}</div>

          </div>
          ${todayContent && todayContent !== 'REST' ? `
            <div class="today-content">
              <div class="session-content">${formatSessionContent(todayContent, DOW_COLOR[nextIdx])}</div>

              <div class="session-content" style="color:var(--text-muted)">Rest day — next session coming up.</div>

        <!-- AI Coach (Phase 2.1) -->

        <!-- Stats -->

            <div class="stat-label">Body Weight</div>
          </div>
          <div class="prs-grid">
            <div class="card pr-card">
              <div class="pr-value">${state.prs.bench}</div>
              <div class="stat-label">Bench</div>
            </div>
            <div class="card pr-card">
              <div class="pr-value">${state.prs.squat}</div>
              <div class="stat-label">Squat</div>
            </div>
            <div class="card pr-card">
              <div class="pr-value">${state.prs.deadlift}</div>
              <div class="stat-label">Deadlift</div>
            </div>

        <!-- Milestones -->
        <div class="section-header" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Upcoming Milestones</span>
          <button class="edit-btn ${state.editingMilestones ? 'active' : ''}" id="toggleMilestoneEdit">
            ${state.editingMilestones ? 'Done' : 'Edit'}

        ${state.editingMilestones ? renderMilestoneEditor() : upcoming.map(m => `
          <div class="card milestone-card">
            <div class="milestone-left">
              <span class="milestone-emoji">${escapeHtml(m.emoji)}</span>
              <span class="milestone-label">${escapeHtml(m.label)}</span>
            </div>
            <div class="milestone-right">
              <div class="milestone-days">${daysUntil(m.date)}</div>
              <div class="milestone-unit">days</div>
            </div>

        `).join('')}

        <!-- Goals -->
        <div class="mt-16">
          <div class="section-header">Season Goals</div>

              <div class="card goal-card">

                <span class="goal-label">${g.label}</span>

        <!-- HR Zones -->

            ${state.editingHRZones ? renderHRZoneEditor() : `
              ${getHRZones().map(z => `
                <div class="zone-row">

                    <div class="zone-bar-outer">

                      </div>
                    </div>
                    <div class="zone-use">${z.use}</div>
                  </div>
                  <div class="zone-bpm">
                    <div class="zone-bpm-value">${z.low}–${z.high}</div>
                    <div class="zone-bpm-pct">${z.pct}</div>
                  </div>
                </div>
              `).join('')}
              <div class="zone-rule">
                <div class="zone-rule-title">⚠️ Zone 2 Rule</div>
                <div class="zone-rule-text">
                  Easy + Long runs = <strong>HR ${_z2.low}–${_z2.high} bpm</strong>. Walk uphills if needed. Pace doesn't matter — only HR does.<br>
                  Quality runs = pace matters. Push the HR up.
                </div>
              </div>
            `}
          </div>
        </div>
      `;

      document.getElementById('home-tab').innerHTML = html;

      // ── HR zone editor wiring ─────────────────────────────────────────
      const toggleHR = document.getElementById('toggleHRZoneEdit');
      if (toggleHR) {
        toggleHR.addEventListener('click', () => {
          state.editingHRZones = !state.editingHRZones;
          renderHome();
        });
      }
      if (state.editingHRZones) bindHRZoneEditorEvents();

      // ── Milestone editor wiring ───────────────────────────────────────
      const toggleMS = document.getElementById('toggleMilestoneEdit');
      if (toggleMS) {
        toggleMS.addEventListener('click', () => {
          state.editingMilestones = !state.editingMilestones;
          renderHome();
        });
      }
      if (state.editingMilestones) bindMilestoneEditorEvents();

      // AI Coach card tap → open chat overlay
      document.getElementById('coachHomeCard')?.addEventListener('click', () => {

      if (todayCard && todayCard.classList.contains('clickable')) {
        todayCard.addEventListener('click', () => {
          const wk = parseInt(todayCard.dataset.week);
          const dayIndex = parseInt(todayCard.dataset.dayindex);

          // Switch to Program tab and open session
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelector('.tab[data-tab="program"]').classList.add('active');
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          document.getElementById('program-tab').classList.add('active');
          state.tab = 'program';
          state.selectedWeek = wk;
          state.selectedDayIndex = dayIndex;
          state.programView = 'session';
          renderProgram();
        });
      }
    }

    // ─────────────────────────────────────────────────────────────────────
    // HR ZONE EDITOR
    // ─────────────────────────────────────────────────────────────────────
    function renderHRZoneEditor() {
      const z = getHRZones(); // currently effective (with any overrides applied)
      const cfg = state.hrConfig || {};
      const ov = cfg.zoneBoundaries || {};
      const hasOverrides = !!cfg.zoneBoundaries && Object.values(ov).some(v => Number.isFinite(v));
      const row = (label, id, val, hint) => `
        <div style="display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;margin-bottom:10px;">
          <div>
            <div style="font-size:12px;font-family:'DM Mono',monospace;color:var(--text);">${label}</div>
            ${hint ? `<div style="font-size:10px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-top:2px;">${hint}</div>` : ''}
          </div>
          <input type="number" class="form-input hr-edit-input" id="${id}" inputmode="numeric" min="40" max="230" value="${val}" style="text-align:center;font-family:'DM Mono',monospace;">
        </div>`;
      return `
        <div style="padding:4px 2px;">
          <div style="font-size:11px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-bottom:14px;line-height:1.5;">
            Set your max HR; the five zones are computed from standard %s. Override any boundary below if you have a lactate-threshold or critical-power test result.
          </div>
          ${row('Max HR', 'hr-max', getMaxHR(), 'measured peak (Z5 ceiling)')}
          <div style="border-top:1px solid var(--border);margin:6px 0 12px;"></div>
          ${row('Z1 ceiling', 'hr-z1', z[0].high, 'top of Recovery (default 65%)')}
          ${row('Z2 ceiling', 'hr-z2', z[1].high, 'top of Aerobic — Z2 cap (default 75%)')}
          ${row('Z3 ceiling', 'hr-z3', z[2].high, 'top of Tempo (default 85%)')}
          ${row('Z4 ceiling', 'hr-z4', z[3].high, 'top of Threshold (default 92%)')}
          <div id="hr-edit-err" style="display:none;font-size:11px;color:var(--tag-red);font-family:'DM Mono',monospace;margin:8px 0;line-height:1.5;"></div>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
            <button class="btn-primary" id="hr-save" style="flex:1;min-width:120px;">Save zones</button>
            <button class="edit-btn" id="hr-reset" style="flex:1;min-width:120px;" ${hasOverrides ? '' : 'disabled style="flex:1;min-width:120px;opacity:0.5;"'}>Reset to %-derived</button>
          </div>
        </div>
      `;
    }

    function bindHRZoneEditorEvents() {
      const errEl = document.getElementById('hr-edit-err');
      const showErr = (msg) => {
        if (!errEl) return;
        errEl.textContent = msg;
        errEl.style.display = 'block';
      };
      const clearErr = () => { if (errEl) errEl.style.display = 'none'; };

      const readInt = (id) => {
        const v = parseInt(document.getElementById(id)?.value, 10);
        return Number.isFinite(v) ? v : null;
      };

      document.getElementById('hr-save')?.addEventListener('click', () => {
        clearErr();
        const max = readInt('hr-max');
        const z1  = readInt('hr-z1');
        const z2  = readInt('hr-z2');
        const z3  = readInt('hr-z3');
        const z4  = readInt('hr-z4');
        if ([max, z1, z2, z3, z4].some(v => v === null)) return showErr('All five fields are required.');
        if (max < 120 || max > 230) return showErr('Max HR must be between 120 and 230 bpm.');
        if (!(z1 < z2 && z2 < z3 && z3 < z4 && z4 < max)) {
          return showErr('Zone ceilings must strictly ascend and stay below max HR.');
        }
        // Z1 floor stays %-derived to keep the form short — it's rarely
        // calibrated explicitly and not used in any threshold check.
        state.hrConfig = {
          maxHR: max,
          zoneBoundaries: { z1High: z1, z2High: z2, z3High: z3, z4High: z4, z5High: max }
        };
        persistHRConfig();
        state.editingHRZones = false;
        renderHome();
      });

      document.getElementById('hr-reset')?.addEventListener('click', () => {
        clearErr();
        // Keep maxHR; drop explicit boundaries so zones revert to %-derived.
        const max = readInt('hr-max') || (state.hrConfig?.maxHR || 183);
        state.hrConfig = { maxHR: max, zoneBoundaries: null };
        persistHRConfig();
        renderHome(); // stay in editor with the reset values shown
      });
    }

    // ─────────────────────────────────────────────────────────────────────
    // MILESTONE EDITOR
    // ─────────────────────────────────────────────────────────────────────

            <button class="btn-primary" id="ms-save" style="flex:1;min-width:120px;">Save</button>
          </div>
        </div>
      `;
    }

    function bindMilestoneEditorEvents() {
      const errEl = () => document.getElementById('ms-edit-err');
      const showErr = (msg) => { const e = errEl(); if (e) { e.textContent = msg; e.style.display = 'block'; } };
      const clearErr = () => { const e = errEl(); if (e) e.style.display = 'none'; };

      // Read-back: pull current input values into state.milestones (working copy).
      const readBack = () => {
        const list = state.milestones || [];
        document.querySelectorAll('.ms-edit-row').forEach(row => {
          const i = parseInt(row.dataset.msi, 10);
          if (!list[i]) return;
          list[i].emoji = (document.querySelector(`.ms-emoji[data-msi="${i}"]`)?.value || '').trim();
          list[i].label = (document.querySelector(`.ms-label[data-msi="${i}"]`)?.value || '').trim();
          list[i].date  = (document.querySelector(`.ms-date[data-msi="${i}"]`)?.value || '').trim();
        });
      };

      document.querySelectorAll('.ms-del').forEach(btn => {
        btn.addEventListener('click', () => {
          readBack();
          const i = parseInt(btn.dataset.msi, 10);
          state.milestones.splice(i, 1);
          renderHome();
        });
      });

      document.getElementById('ms-add')?.addEventListener('click', () => {
        readBack();
        if (!Array.isArray(state.milestones)) state.milestones = [];
        state.milestones.push({ label: '', date: '', emoji: '🎯' });
        renderHome();
      });

      document.getElementById('ms-save')?.addEventListener('click', () => {
        clearErr();
        readBack();
        // Validate: label + valid yyyy-mm-dd date required.
        const bad = (state.milestones || []).findIndex(m =>
          !m.label || !m.date || !/^\d{4}-\d{2}-\d{2}$/.test(m.date)
        );
        if (bad >= 0) return showErr(`Row ${bad + 1}: label and date are required.`);
        // Sort by date ascending.
        state.milestones.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        persistMilestones();
        state.editingMilestones = false;
        renderHome();
      });
    }

    async function renderProgram() {
      if (state.programView === 'weeks') {
        renderProgramWeeks();
      } else if (state.programView === 'week') {
        renderWeekView();
      } else if (state.programView === 'session') {
        await renderSessionLogger();
      }
    }

    function renderProgramWeeks() {
      const cw = getCurrentWeek();
      
      let html = `<div class="section-header">32-Week Plan</div>`;
      
      PHASE_INFO.forEach(phase => {
        const phaseColors = {
          phase1: 'var(--phase1)',
          phase2: 'var(--phase2)',
          phase3: 'var(--phase3)',
          phaseTaper: 'var(--phase-taper)',
          phaseMarathon: 'var(--phase-marathon)'
        };
        
        html += `
          <div class="phase-section">
            <div class="phase-label">${phase.label}</div>
            <div class="weeks-grid">
              ${phase.weeks.map(wk => {
                const isActive = wk === cw;
                const isPast = wk < cw;
                const { done, total } = getWeekCompletion(wk);
                const isComplete = done === total && total > 0;
                return `
                  <button class="week-btn ${isActive ? 'active' : ''} ${isPast ? 'past' : ''} ${isComplete ? 'complete' : ''}"
                    data-week="${wk}"
                    style="background:${isActive ? 'var(--accent)' : phaseColors[phase.color]}">
                    <div class="week-num">${wk}</div>
                    <div class="week-date">${WEEKS[wk]?.dates?.split('–')[0]?.trim() || ''}</div>
                    ${total > 0 ? `<div class="week-progress" style="color:${isActive ? 'rgba(255,255,255,0.7)' : done > 0 ? 'var(--success)' : 'var(--text-muted)'}">${done}/${total}</div>` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      document.getElementById('program-tab').innerHTML = html;

      // Add click handlers
      document.querySelectorAll('.week-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedWeek = parseInt(btn.dataset.week);
          state.programView = 'week';
          renderProgram();
        });
      });
    }

    function renderWeekView() {
      const wk = state.selectedWeek;
      const data = WEEKS[wk];
      const phase = getPhase(wk);

      let html = `
        <button class="back-btn" id="backToWeeks">← Back</button>
        <div class="week-header">
          <div>
            <div class="week-title">Week ${wk}</div>
            <div class="week-dates">${data.dates}</div>
          </div>
          <span class="badge">${phase.label.split('—')[0].trim()}</span>
        </div>
        ${data.notes ? `
          <div class="card notes-card">
            <div class="notes-text">${escapeHtml(data.notes)}</div>
          </div>
        ` : ''}
      `;

      SESSION_DAYS.forEach((day, i) => {
        const content = getPlanned(wk, day.key);
        const isCompleted = state.completedSessions[`${wk}_${day.key}`];
        const preview = content ? content.split('\n').slice(0, 3).join('\n') + (content.split('\n').length > 3 ? '\n…' : '') : '';

        html += `
          <button class="session-btn ${isCompleted ? 'complete' : ''}" 
            data-day="${i}"
            style="border-left-color:${content ? (isCompleted ? 'var(--success)' : day.color) : 'var(--border)'}">
            <div class="session-btn-header" ${content ? 'style="margin-bottom:8px"' : ''}>
              <div class="session-btn-left">
                <span class="session-btn-icon">${isCompleted ? '✅' : day.icon}</span>
                <div>
                  <div class="session-btn-title ${content ? '' : 'empty'}">${day.label}</div>
                  <div class="session-btn-sub">${day.sub}</div>
                </div>
              </div>
              <span class="session-btn-arrow">›</span>
            </div>
            ${content ? `<div class="session-btn-preview">${escapeHtml(preview)}</div>` : ''}
          </button>
