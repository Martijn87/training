<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f7f4ef">
  <title>Mardy · 2026 Training</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f7f4ef;
      --bg-card: #ffffff;
      --bg-card-alt: #f0ece4;
      --border: #e0d8cc;
      --border-strong: #c8bfb0;
      --accent: #2a5298;
      --accent-soft: #e8eef8;
      --gold: #b8860b;
      --gold-soft: #fdf6e3;
      --success: #1a7a3e;
      --success-soft: #e8f5e9;
      --text: #1a1612;
      --text-sub: #6b5d4a;
      --text-muted: #9e8f7d;
      --tab-active: #2a5298;
      --tab-inactive: #9e8f7d;
      --phase1: #d4edda;
      --phase2: #cce5ff;
      --phase3: #fff3cd;
      --phase-taper: #f8d7da;
      --phase-marathon: #e2d9f3;
      --tag-red: #c0392b;
      --tag-green: #1a7a3e;
      --tag-blue: #2a5298;
      --tag-orange: #c8631a;
    }
    
    [data-theme="dark"] {
      --bg: #0f0d0a;
      --bg-card: #1a1612;
      --bg-card-alt: #221e18;
      --border: #2a2416;
      --border-strong: #3a3020;
      --accent: #4a7fd4;
      --accent-soft: #1a2640;
      --gold: #f0c040;
      --gold-soft: #1a1508;
      --success: #40b870;
      --success-soft: #0a1f10;
      --text: #e8d5a3;
      --text-sub: #9e8a6a;
      --text-muted: #6b5d3f;
      --tab-active: #f0c040;
      --tab-inactive: #6b5d3f;
      --phase1: #1a3020;
      --phase2: #0f1f3a;
      --phase3: #2a2010;
      --phase-taper: #2a1010;
      --phase-marathon: #1a1030;
      --tag-red: #e05040;
      --tag-green: #40b870;
      --tag-blue: #4a7fd4;
      --tag-orange: #e0903a;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    
    .mono { font-family: 'DM Mono', monospace; }
    .serif { font-family: 'Playfair Display', serif; }
    
    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 20px 0;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
      font-family: 'Playfair Display', serif;
      letter-spacing: -0.01em;
    }
    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 10px;
      color: var(--text-sub);
      font-family: 'DM Mono', monospace;
    }
    
    /* Tabs */
    .tabs {
      display: flex;
    }
    .tab {
      flex: 1;
      background: none;
      border: none;
      padding: 8px 0 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .tab.active {
      border-bottom-color: var(--tab-active);
    }
    .tab-icon {
      font-size: 13px;
      color: var(--tab-inactive);
    }
    .tab.active .tab-icon {
      color: var(--tab-active);
    }
    .tab-label {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--tab-inactive);
    }
    .tab.active .tab-label {
      color: var(--tab-active);
    }
    
    /* Content */
    .content {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    
    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card-alt {
      background: var(--bg-card-alt);
    }
    
    /* Progress bar */
    .progress-card {
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-label {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .progress-count {
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      color: var(--accent);
      font-weight: 700;
    }
    .progress-bar {
      height: 8px;
      background: var(--bg-card-alt);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--success);
      border-radius: 4px;
      transition: width 0.3s;
    }
    
    /* Today card */
    .today-card {
      border-left: 3px solid var(--accent);
      background: var(--bg-card-alt);
      margin-bottom: 16px;
    }
    .today-card.clickable {
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .today-card.clickable:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    .today-card.clickable:active {
      transform: translateY(0);
    }
    .today-card-cta {
      font-size: 11px;
      color: var(--text-muted);
      text-align: right;
      padding-top: 6px;
      letter-spacing: 0.3px;
    }
    .today-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .today-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .today-icon {
      font-size: 22px;
    }
    .today-label-small {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1px;
    }
    .today-label-main {
      font-size: 17px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
    }
    .today-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }
    .today-right {
      text-align: right;
    }
    .today-week {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }
    .today-phase {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-top: 2px;
    }
    .today-content {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 12px;
    }
    .session-content {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-line;
    }
    .session-highlight {
      font-weight: 700;
    }
    .session-hr {
      color: var(--tag-red);
    }
    
    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      text-align: center;
      padding: 12px 8px;
      margin-bottom: 0;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
    }
    .stat-value-accent { color: var(--accent); }
    .stat-value-gold { color: var(--gold); }
    .stat-label {
      font-size: 9px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-top: 2px;
    }
    .prs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .pr-card {
      text-align: center;
      padding: 12px 4px;
      margin-bottom: 0;
    }
    .pr-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      font-family: 'Playfair Display', serif;
    }
    
    /* Section headers */
    .section-header {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-left: 2px;
    }
    
    /* Milestone cards */
    .milestone-card {
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .milestone-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .milestone-emoji {
      font-size: 18px;
    }
    .milestone-label {
      font-size: 13px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }
    .milestone-right {
      text-align: right;
    }
    .milestone-days {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      font-family: 'Playfair Display', serif;
      line-height: 1;
    }
    .milestone-unit {
      font-size: 9px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }
    
    /* Goals grid */
    .goals-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .goal-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 0;
    }
    .goal-emoji {
      font-size: 18px;
    }
    .goal-label {
      font-size: 12px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }
    
    /* Program Suggestion Cards */
    .ai-suggestions { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    .ai-suggest-header { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; }
    .ai-suggest-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .ai-suggest-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .ai-suggest-reason { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 10px; font-family: 'DM Mono', monospace; }
    .ai-suggest-diff { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: 'DM Mono', monospace; margin-bottom: 10px; flex-wrap: wrap; }
    .ai-diff-old { color: var(--tag-red); text-decoration: line-through; }
    .ai-diff-new { color: var(--success); font-weight: 600; }
    .ai-diff-arrow { color: var(--text-muted); }
    .ai-apply-btn { font-size: 11px; padding: 5px 12px; }
    .ai-applied-badge { font-size: 11px; color: var(--success); font-family: 'DM Mono', monospace; padding: 5px 0; }

    /* HR Zones */
    .zones-card {
      padding: 14px 16px;
    }
    .zone-row {
      display: grid;
      grid-template-columns: 32px 1fr 90px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .zone-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 700;
    }
    .zone-bar-outer {
      height: 18px;
      border-radius: 3px;
      background: var(--bg-card-alt);
      overflow: hidden;
    }
    .zone-bar-inner {
      height: 100%;
      border-radius: 3px;
      opacity: 0.75;
      display: flex;
      align-items: center;
      padding-left: 6px;
    }
    .zone-bar-name {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      color: #fff;
      white-space: nowrap;
    }
    .zone-bpm {
      text-align: right;
    }
    .zone-bpm-value {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }
    .zone-bpm-pct {
      font-size: 9px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }
    .zone-use {
      font-size: 9px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-top: 2px;
    }
    .zone-rule {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 4px;
    }
    .zone-rule-title {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      color: var(--tag-red);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .zone-rule-text {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--text-sub);
      line-height: 1.6;
    }
    
    /* Program tab */
    .phase-section {
      margin-bottom: 20px;
    }
    .phase-label {
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 8px;
      padding-left: 2px;
    }
    .weeks-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .week-btn {
      background: var(--phase1);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 4px;
      cursor: pointer;
      text-align: center;
      position: relative;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .week-btn:active {
      transform: scale(0.97);
    }
    .week-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    .week-btn.past {
      opacity: 0.7;
    }
    .week-btn.complete::after {
      content: '✓';
      position: absolute;
      top: 3px;
      right: 3px;
      font-size: 10px;
      color: var(--success);
    }
    .week-num {
      font-size: 15px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--accent);
    }
    .week-btn.active .week-num {
      color: #fff;
    }
    .week-date {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .week-btn.active .week-date {
      color: rgba(255,255,255,0.7);
    }
    .week-progress {
      font-size: 8px;
      font-family: 'DM Mono', monospace;
      margin-top: 2px;
    }
    
    /* Week view */
    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-sub);
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      padding: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .week-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .week-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      font-family: 'Playfair Display', serif;
    }
    .week-dates {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .badge {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 2px 7px;
      opacity: 0.7;
    }
    .notes-card {
      background: var(--gold-soft);
      border-color: var(--gold);
      margin-bottom: 16px;
    }
    .notes-text {
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      color: var(--text-sub);
      line-height: 1.6;
      white-space: pre-line;
    }
    
    /* Session buttons */
    .session-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      border-left-width: 3px;
      transition: transform 0.1s;
    }
    .session-btn:active {
      transform: scale(0.98);
    }
    .session-btn.complete {
      border-color: var(--success);
    }
    .session-btn-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .session-btn-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .session-btn-icon {
      font-size: 16px;
    }
    .session-btn-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }
    .session-btn-title.empty {
      color: var(--text-muted);
    }
    .session-btn-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }
    .session-btn-arrow {
      font-size: 12px;
      color: var(--text-muted);
    }
    .session-btn-preview {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-sub);
      line-height: 1.6;
      white-space: pre-line;
      max-height: 60px;
      overflow: hidden;
      margin-top: 8px;
    }
    
    /* Session logger */
    .logger-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logger-icon {
      font-size: 24px;
    }
    .logger-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      font-family: 'Playfair Display', serif;
    }
    .logger-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }
    .planned-card {
      background: var(--bg-card-alt);
      margin-bottom: 16px;
    }
    .planned-label {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    
    /* Form inputs */
    .form-row {
      margin-bottom: 12px;
    }
    .form-label {
      font-size: 10px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 4px;
    }
    .form-label.important {
      color: var(--tag-red);
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--accent);
    }
    .form-input.important {
      border-color: rgba(192, 57, 43, 0.3);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .form-textarea {
      resize: vertical;
      min-height: 60px;
    }
    
    /* Zone compliance */
    .zone-compliance {
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
    }
    .zone-compliance.good {
      background: var(--success-soft);
      border: 1px solid var(--success);
      color: var(--success);
    }
    .zone-compliance.bad {
      background: var(--gold-soft);
      border: 1px solid var(--tag-orange);
      color: var(--tag-orange);
    }
    
    /* Exercise logger */
    .exercise-block {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .exercise-name-input {
      font-weight: 600;
      width: calc(100% - 30px);
    }
    .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 18px;
      padding: 4px;
    }
    .set-row {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr auto;
      gap: 6px;
      margin-bottom: 6px;
      align-items: center;
    }
    .set-label {
      font-size: 9px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 3px;
    }
    .add-set-btn {
      background: none;
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 6px;
      width: 100%;
      color: var(--text-sub);
      font-family: 'DM Mono', monospace;

    let currentUser = null;

    function setSyncDot(status) {
      const dot = document.getElementById('syncDot');
      if (!dot) return;
      // Don't override 'error' if there are still pending items
      const q = getQueue();
      if (status === 'synced' && q.length > 0) {
        dot.className = 'sync-dot error';
        dot.title = `${q.length} session(s) pending upload`;
      } else {
        dot.className = 'sync-dot ' + status;
        dot.title = status === 'error' ? 'Sync error — session saved locally' : '';
      }
    }

    async function loadProfile() {
      const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
      if (error || !data) return;
      state.prs = data.prs || state.prs;
      state.runPRs = data.run_prs || state.runPRs;
      state.bodyWeight = data.body_weight || '';
      state.theme = data.theme || 'light';
      state.completedSessions = data.completed_sessions || {};
      if (data.custom_exercises) {
        localStorage.setItem('customExercises', JSON.stringify(data.custom_exercises));
      }
      // ── Merge program_overrides: remote ∪ local-only-by-ts ─────────────
      // Pre-v1.01, an apply that failed to reach Supabase could be silently
      // overwritten here. Now we keep any local-only entries and push the
      // union back to remote, so a failed sync recovers on next login.
      // v1.02 additionally migrates the merged set to the v2 schema in-place
      // (idempotent — running twice yields the same ids, no duplicates).
      if (data.program_overrides && Array.isArray(data.program_overrides)) {
        const local = Array.isArray(state.programOverrides) ? state.programOverrides : [];
        const remoteTs = new Set(data.program_overrides.map(o => o && o.ts).filter(Boolean));
        const localOnly = local.filter(o => o && o.ts && !remoteTs.has(o.ts));
        const merged = migrateOverridesV2([...data.program_overrides, ...localOnly]);
        state.programOverrides = merged;
        localStorage.setItem('programOverrides', JSON.stringify(merged));
        if (localOnly.length > 0) {
          // Push the reconciled set back so future logins see it as remote.
          saveState().catch(e => console.warn('override reconcile push failed (non-fatal):', e));
        }
      } else {
        // No remote data — still migrate the local set so it's v2-shaped
        // before any other code reads it this session.
        if (Array.isArray(state.programOverrides) && state.programOverrides.length > 0) {
          state.programOverrides = migrateOverridesV2(state.programOverrides);
          localStorage.setItem('programOverrides', JSON.stringify(state.programOverrides));
        }
      }
      // ── Optional cross-device sync for HR config + milestones ──────────
      // These columns may not exist on every install. If they do, prefer
      // them over localStorage; if not, stay with the local copy.
      if (data.hr_config && typeof data.hr_config === 'object') {
        state.hrConfig = { maxHR: 183, zoneBoundaries: null, ...data.hr_config };
        localStorage.setItem('hrConfig', JSON.stringify(state.hrConfig));
      }
      if (data.milestones && Array.isArray(data.milestones)) {
        state.milestones = data.milestones;
        localStorage.setItem('milestones', JSON.stringify(state.milestones));
      }
      if (data.exercise_prs && typeof data.exercise_prs === 'object') {
        state.exercisePRs = data.exercise_prs;
        localStorage.setItem('exercisePRs', JSON.stringify(state.exercisePRs));
      }
      document.body.dataset.theme = state.theme;
      document.getElementById('themeToggle').textContent = state.theme === 'light' ? '☽ Dark' : '☀ Light';
      document.querySelector('meta[name="theme-color"]').content = state.theme === 'light' ? '#f7f4ef' : '#0f0d0a';

      // ── Reconcile completedSessions against session_logs ──────────
      // session_logs is the source of truth for actual saved workouts.
      // If saveState() ever failed silently, completedSessions in profiles
      // can lag behind. This brings them back in sync on every login.
      try {
        const { data: logs } = await sb.from('session_logs')
          .select('week, session_key')
          .eq('user_id', currentUser.id);
        if (logs && logs.length > 0) {
          let changed = false;
          logs.forEach(({ week, session_key }) => {
            const key = session_key; // session_key is already "${week}_${dayKey}" e.g. "5_upperA"
            if (!state.completedSessions[key]) {
              state.completedSessions[key] = true;
              changed = true;
            }
          });
          // Write reconciled state back to profiles so it stays in sync
          if (changed) {
            await sb.from('profiles').upsert({
              id: currentUser.id,
              completed_sessions: state.completedSessions,
              updated_at: new Date().toISOString()
            });
          }
        }
      } catch (e) {
        console.warn('completedSessions reconcile failed (non-fatal):', e);
      }
    }

    async function saveState() {
      if (!currentUser) {
        // fallback to localStorage if somehow not logged in
        localStorage.setItem('theme', state.theme);
        return;
      }
      setSyncDot('syncing');
      const { error } = await sb.from('profiles').upsert({
        id: currentUser.id,
        prs: state.prs,
        run_prs: state.runPRs,
        body_weight: state.bodyWeight,
        theme: state.theme,
        completed_sessions: state.completedSessions,
        custom_exercises: JSON.parse(localStorage.getItem('customExercises') || '[]'),
        program_overrides: state.programOverrides || [],
        exercise_prs: state.exercisePRs || {},
        updated_at: new Date().toISOString()
      });
      setSyncDot(error ? 'error' : 'synced');
    }

    async function loadSession(week, sessionKey) {
      // Always try localStorage first as fallback
      const localFallback = () => JSON.parse(localStorage.getItem(`session_${week}_${sessionKey}`) || '{}');
      if (!currentUser) return localFallback();
      try {
        const { data, error } = await sb.from('session_logs')
          .select('data').eq('user_id', currentUser.id)
          .eq('week', week).eq('session_key', sessionKey).single();
        if (error) return localFallback();
        return data?.data || localFallback();
      } catch (e) {
        console.warn('loadSession Supabase error (using local):', e);
        return localFallback();
      }
    }

    // ── OFFLINE QUEUE ──────────────────────────────────────────────
    const QUEUE_KEY = 'offlineQueue';

    function getQueue() {
      try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch { return []; }
    }
    function setQueue(q) {
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
      updateSyncBadge();
    }
    function addToQueue(week, sessionKey, payload) {
      const q = getQueue();
      // replace existing entry for same week+session
      const idx = q.findIndex(e => e.week === week && e.sessionKey === sessionKey);
      const entry = { week, sessionKey, payload, queuedAt: new Date().toISOString() };
      if (idx >= 0) q[idx] = entry; else q.push(entry);
      setQueue(q);
    }
    function updateSyncBadge() {
      const q = getQueue();
      const dot = document.getElementById('syncDot');
      if (!dot) return;
      if (q.length > 0) {
        dot.className = 'sync-dot error';
        dot.title = `${q.length} session(s) pending upload`;
      }
      // also update settings button if visible
      const pendingBtn = document.getElementById('uploadPendingBtn');
      if (pendingBtn) {
        pendingBtn.textContent = q.length > 0 ? `⬆ Upload ${q.length} pending session${q.length > 1 ? 's' : ''}` : '✓ All sessions synced';
        pendingBtn.disabled = q.length === 0;
      }
    }

    async function flushQueue() {
      if (!currentUser) return 0;
      const q = getQueue();
      if (q.length === 0) return 0;
      setSyncDot('syncing');
      const remaining = [];
      for (const entry of q) {
        if ((entry.retries || 0) >= 5) {
          console.warn('Dropping queue entry after 5 failures:', entry.week, entry.sessionKey);
          continue; // give up — don't block the queue forever
        }
        const { error } = await sb.from('session_logs').upsert({
          user_id: currentUser.id,
          week: entry.week,
          session_key: entry.sessionKey,
          data: entry.payload,
          saved_at: new Date().toISOString()
        }, { onConflict: 'user_id,week,session_key' });
        if (error) remaining.push({ ...entry, retries: (entry.retries || 0) + 1 });
      }
      setQueue(remaining);
      setSyncDot(remaining.length > 0 ? 'error' : 'synced');
      return remaining.length;
    }

    // Auto-flush when coming back online or tab becomes visible
    window.addEventListener('online', () => { if (currentUser) flushQueue(); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && currentUser) flushQueue();
    });

    async function saveSession(week, sessionKey, payload) {
      // Always save locally first — instant, works offline
      localStorage.setItem(`session_${week}_${sessionKey}`, JSON.stringify(payload));

      if (!currentUser) {
        addToQueue(week, sessionKey, payload);
        return;
      }

      setSyncDot('syncing');
      try {
        const { error } = await sb.from('session_logs').upsert({
          user_id: currentUser.id,
          week: week,
          session_key: sessionKey,
          data: payload,
          saved_at: new Date().toISOString()
        }, { onConflict: 'user_id,week,session_key' });

        if (error) {
          // Supabase failed — queue it for later
          addToQueue(week, sessionKey, payload);
          setSyncDot('error');
        } else {
          // Success — remove from queue if it was there
          const q = getQueue().filter(e => !(e.week === week && e.sessionKey === sessionKey));
          setQueue(q);
          setSyncDot('synced');
        }
      } catch (e) {
        // Network error — queue it
        addToQueue(week, sessionKey, payload);
        setSyncDot('error');
      }
    }

        } catch { return DEFAULT; }
      })(),
      // Season milestones: persisted user copy of the default MILESTONES list.
      // Initialised from the constant on first run (see initMilestonesIfEmpty).
      milestones: (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('milestones') || 'null');
          return Array.isArray(stored) ? stored : null;
        } catch { return null; }
      })(),
      // Editor view flags (transient; not persisted)
      editingHRZones: false,
      editingMilestones: false,
      // ── Coach (Phase 2.1) ──────────────────────────────────────────
      // Persisted chat history; capped at 50 messages in addCoachMessage().
      coachConversation: (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('coachConversation') || '[]');
          return Array.isArray(stored) ? stored.slice(-50) : [];
        } catch { return []; }
      })()
    };

    // v1.02 cold-start migration: ensure any overrides loaded from
    // localStorage are v2-shaped before the first render runs. Idempotent.
    // (loadProfile also migrates after Supabase merge; this covers the
    // window between state init and the first network round-trip.)
    try {
      if (Array.isArray(state.programOverrides) && state.programOverrides.length > 0) {
        const before = JSON.stringify(state.programOverrides);
        state.programOverrides = state.programOverrides.map(o => {
          // Inline subset of upgradeOverrideToV2 — the function is defined
          // later in the file. Same logic; kept short here.
          if (!o || typeof o !== 'object') return o;
          if (o.kind && o.payload && o.changeId) return o;
          return {
            ...o,
            kind: o.kind || 'text_replace',
            payload: o.payload || { oldValue: o.oldValue, newValue: o.newValue },
            changeId: o.changeId || (
              o.ts && o.week != null && o.sessionKey
                ? 'legacy_' + o.ts + '_' + o.week + '_' + o.sessionKey
                : 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10)
            ),
            sourceMsgId: o.sourceMsgId || '',
            principleRefs: Array.isArray(o.principleRefs) ? o.principleRefs : [],
            ts: o.ts || new Date().toISOString()
          };
        });
        const after = JSON.stringify(state.programOverrides);
        if (before !== after) localStorage.setItem('programOverrides', after);
      }
    } catch (e) {
      console.warn('v1.02 cold-start override migration failed (non-fatal):', e);
    }

    // ═══════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════
    // ─── Program Override helpers (v2 schema, Phase 2.0) ──────────────────
    //
    // ProposedChange v2 — the canonical shape every override is stored in.
    // The earlier (v1.x) shape only supported full-text session rewrites;
    // v2 adds a `kind` discriminator so future change types (day shifts,
    // volume scales, race anchors, goal edits, etc.) plug in without
    // touching the storage or merge layers.
    //
    // /** @typedef {object} ProposedChange
    //  *  @property {string} changeId        Globally unique (UUID-like).
    //  *  @property {string} ts              ISO timestamp; ALSO the merge
    //  *                                     dedupe key for cross-device sync.
    //  *  @property {string} [sourceMsgId]   Groups changes from the same
    //  *                                     coach turn (used by Phase 2.1+).
    //  *  @property {('text_replace'
    //  *              |'session_day_shift'
    //  *              |'session_swap'
    //  *              |'session_scale'
    //  *              |'block_scale'
    //  *              |'session_insert'
    //  *              |'session_delete'
    //  *              |'week_replace'
    //  *              |'goal_set'
    //  *              |'discipline_focus')} kind
    //  *  @property {number} [week]
    //  *  @property {string} [sessionKey]
    //  *  @property {object} payload         Shape depends on kind:
    //  *      text_replace        → { oldValue, newValue }
    //  *      session_day_shift   → { fromDow, toDow }
    //  *      session_swap        → { sessionA, sessionB }
    //  *      session_scale       → { volumeFactor?, weightDelta? }
    //  *      block_scale         → { fromWeek, toWeek, factor }
    //  *      session_insert      → { dow, content }
    //  *      session_delete      → { dow }
    //  *      week_replace        → { content: { [sessionKey]: string } }
    //  *      goal_set            → { milestone }
    //  *      discipline_focus    → { primary, maintenance }
    //  *  @property {string[]} [principleRefs] Which Crawley principles drove
    //  *                                       this (e.g. ['thirty_pct_maint']).
    //  *  @property {string} [rationale]     Prose 'why' shown in UI.
    //  *
    //  *  Legacy fields preserved for the v1.x display code (Settings list,
    //  *  coach badge, etc.): label, emoji, reason, week, sessionKey,
    //  *  oldValue, newValue, id (numeric counter from suggestion builder).
    //  */

    function newChangeId() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
      return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
    }

    // Idempotent: an already-v2 record passes through unchanged. A v1 record
    // gains `kind`, `payload`, `changeId`, `principleRefs`. Original fields
    // are preserved so v1 display code (label/emoji/reason/oldValue/newValue)
    // keeps working without edits.
    function upgradeOverrideToV2(o) {
      if (!o || typeof o !== 'object') return o;
      if (o.kind && o.payload && o.changeId) return o; // already v2
      const upgraded = {
        ...o,
        kind: o.kind || 'text_replace',
        payload: o.payload || {
          oldValue: o.oldValue,
          newValue: o.newValue
        },
        // Stable changeId for legacy records → migration is idempotent
        // (running twice yields the same id, so no duplicates appear).
        changeId: o.changeId || (
          o.ts && o.week != null && o.sessionKey
            ? 'legacy_' + o.ts + '_' + o.week + '_' + o.sessionKey
            : newChangeId()
        ),
        sourceMsgId: o.sourceMsgId || '',
        principleRefs: Array.isArray(o.principleRefs) ? o.principleRefs : []
      };
      // Ensure ts is present (v1.01 already stamped it, but be defensive).
      if (!upgraded.ts) upgraded.ts = new Date().toISOString();
      return upgraded;
    }

    // Migrates an entire override array. Returns a NEW array; doesn't mutate.
    function migrateOverridesV2(list) {
      if (!Array.isArray(list)) return [];
      return list.map(upgradeOverrideToV2);
    }

    // ─── resolvePlanned — the new canonical reader ──────────────────────
    //
    // Walks the override chain for (wk, sessionKey) in chronological order
    // and dispatches on `kind`. Today only `text_replace` is implemented
    // (last-writer-wins, identical to v1.x). Phase 2.1 adds session_scale;
    // Phase 2.2 adds week_replace; the day-shift / swap kinds don't affect
    // CONTENT — they affect WHICH DAY a session sits on, handled separately
    // by getWeeklySchedule().
    function resolvePlanned(wk, sessionKey) {
      const base = WEEKS[wk]?.[sessionKey] ?? null;
      const relevant = (state.programOverrides || []).filter(o =>
        o && o.week === wk && o.sessionKey === sessionKey
      );
      if (relevant.length === 0) return base;
      let value = base;
      for (const raw of relevant) {
        const o = raw.kind ? raw : upgradeOverrideToV2(raw); // tolerate stragglers
        switch (o.kind) {
          case 'text_replace':
          case 'week_replace': // week_replace at the session level acts like text_replace
            value = (o.payload && o.payload.newValue !== undefined)
              ? o.payload.newValue
              : (o.newValue !== undefined ? o.newValue : value);
            break;
          // Phase 2.1+ kinds dispatch here. Until they're implemented,
          // unknown kinds are no-ops so we never crash on forward-compat data.
          default:
            break;
        }
      }
      return value;
    }

    // Back-compat wrapper. Every existing call site (renderHome, renderWeek,
    // renderSessionLogger, coach builder, etc.) keeps calling getPlanned()
    // and gets the resolved value through the new pipeline.
    function getPlanned(wk, key) {
      return resolvePlanned(wk, key);
    }

    // ─── Weekly schedule (DOW → sessionKey) ────────────────────────────
    //
    // The static default the app shipped with. Phase 2.1 will let users
    // shift a session to a different day-of-week via the coach; this
    // function honours those shifts per-week (no rippling — see the
    // design doc). For v1.02 it always returns the default since no
    // shift overrides exist yet.
    const DEFAULT_DOW_SESSION = [null, 'upperA', 'easy', 'lower', 'quality', 'upperB', 'longRun'];

    function getWeeklySchedule(wk) {
      const base = DEFAULT_DOW_SESSION.slice();
      const shifts = (state.programOverrides || []).filter(o =>
        o && o.week === wk &&
        (o.kind === 'session_day_shift' || o.kind === 'session_swap')
      );
      if (shifts.length === 0) return base;
      // Apply shifts in chronological order. Each shift swaps two slots.
      const dow = base.slice();
      for (const o of shifts) {
        if (o.kind === 'session_day_shift') {
          const from = o.payload?.fromDow;
          const to   = o.payload?.toDow;
          if (Number.isInteger(from) && Number.isInteger(to) && from !== to) {
            const tmp = dow[to]; dow[to] = dow[from]; dow[from] = tmp;
          }
        } else if (o.kind === 'session_swap') {
          const a = o.payload?.sessionA;
          const b = o.payload?.sessionB;
          if (a && b) {
            const ia = dow.indexOf(a), ib = dow.indexOf(b);
            if (ia >= 0 && ib >= 0) {
              const tmp = dow[ia]; dow[ia] = dow[ib]; dow[ib] = tmp;
            }
          }
        }
      }
      return dow;
    }

    async function applyProgramUpdate(override) {
      if (!state.programOverrides) state.programOverrides = [];
      // Upgrade-on-write: every record reaching storage is v2.
      const upgraded = upgradeOverrideToV2(override);
      state.programOverrides.push(upgraded);
      localStorage.setItem('programOverrides', JSON.stringify(state.programOverrides));
      // v1.05 — side-effect for kinds that mutate non-override state.
      // goal_set has to write through to state.milestones; the override
      // record is the audit/undo trail. Failures here are non-fatal (the
      // override is still stored; the user can re-trigger if needed).
      if (upgraded.kind === 'goal_set' && upgraded.payload && upgraded.payload.milestoneLabel && upgraded.payload.newDate) {
        try {
          if (!Array.isArray(state.milestones)) getMilestones();
          const m = state.milestones.find(x => x.label === upgraded.payload.milestoneLabel);
          if (m) {
            m.date = upgraded.payload.newDate;
            // Auto-sort so the timeline stays in order on Home.
            state.milestones.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('milestones', JSON.stringify(state.milestones));
          }
        } catch (e) { console.warn('goal_set side-effect failed:', e); }
      }
      try { await saveState(); } catch (e) { console.warn('saveState failed (override stored locally):', e); }
    }

    function undoLastProgramUpdate() {
      if (!state.programOverrides || state.programOverrides.length === 0) return false;
      // v1.05 — kind-aware undo: goal_set needs to restore state.milestones.
      const last = state.programOverrides[state.programOverrides.length - 1];
      if (last && last.kind === 'goal_set' && last.payload && last.payload.milestoneLabel && last.payload.oldDate) {
        try {
          if (!Array.isArray(state.milestones)) getMilestones();
          const m = state.milestones.find(x => x.label === last.payload.milestoneLabel);
          if (m) {
            m.date = last.payload.oldDate;
            state.milestones.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('milestones', JSON.stringify(state.milestones));
          }
        } catch (e) { console.warn('goal_set undo side-effect failed:', e); }
      }
      state.programOverrides.pop();
      localStorage.setItem('programOverrides', JSON.stringify(state.programOverrides));
      saveState();
      return true;
    }

    // ═══════════════════════════════════════════════════════════════
    // COACH MODULE (Phase 2.1 — offline rule engine)
    // ═══════════════════════════════════════════════════════════════
// ─────────────────────────────────────────────────────────────────────
// COACH MODULE (Phase 2.1) — offline-only rule engine
// ─────────────────────────────────────────────────────────────────────
// Architecture:
//   - parseCoachIntent(text)  → { intent, params } | { intent:'unknown' }
//   - plan{ShiftDay, SwapDay, DeloadNext, HoldFlat}(params)
//                              → { message, changes:ProposedChange[] }
//                              | { error }
//   - addCoachMessage(role, text, changes?) → persists & re-renders
//   - applyCoachChange / skipCoachChange handle individual cards
//
// All planners produce v2 ProposedChange records (Phase 2.0 schema), so
// apply goes through applyProgramUpdate unchanged. The LLM tier (Phase 2.4)
// will plug into the same plan-output shape.

// Vocabulary maps used by the parser. Order matters in arrays (longest first
// so 'upper a' is found before a hypothetical 'upper' alone, and 'tuesday'
// before 'tue').
const COACH_SESSION_PATTERNS = [
  { key: 'longRun', alias: 'long run' },
  { key: 'longRun', alias: 'longrun' },
  { key: 'upperA',  alias: 'upper a' },
  { key: 'upperA',  alias: 'uppera' },
  { key: 'upperA',  alias: 'upper-a' },
  { key: 'upperB',  alias: 'upper b' },
  { key: 'upperB',  alias: 'upperb' },
  { key: 'upperB',  alias: 'upper-b' },
  { key: 'quality', alias: 'quality run' },
  { key: 'quality', alias: 'quality' },
  { key: 'quality', alias: 'intervals' },
  { key: 'quality', alias: 'tempo' },
  { key: 'easy',    alias: 'easy run' },
  { key: 'easy',    alias: 'easy' },
  { key: 'lower',   alias: 'leg day' },
  { key: 'lower',   alias: 'legs' },
  { key: 'lower',   alias: 'lower body' },
  { key: 'lower',   alias: 'lower' },
  { key: 'lower',   alias: 'squat day' }
];
const COACH_DAY_PATTERNS = [
  ['sunday', 0], ['monday', 1], ['tuesday', 2], ['wednesday', 3],
  ['thursday', 4], ['friday', 5], ['saturday', 6],
  ['sun', 0], ['mon', 1], ['tues', 2], ['tue', 2],
  ['wed', 3], ['thurs', 4], ['thur', 4], ['thu', 4],
  ['fri', 5], ['sat', 6]
];

const SESSION_KEY_LABEL = {
  upperA: 'Upper A', upperB: 'Upper B', easy: 'Easy Run',
  lower:  'Legs',    quality: 'Quality Run', longRun: 'Long Run'
};
const DOW_LABEL_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// Hold-flat exercise lookup. Only main lifts in scope for Phase 2.1.
const COACH_HOLD_EXERCISES = {
  bench:    { sessions: ['upperA', 'upperB'], pattern: /\b(?:flat\s+)?(?:bp|bench(?:\s+press)?)\b/i, label: 'Bench' },
  squat:    { sessions: ['lower'],            pattern: /\bsquat\b/i,                                  label: 'Squat' },
  deadlift: { sessions: ['lower'],            pattern: /\b(?:deadlift|\bdl\b|sumo)\b/i,               label: 'Deadlift' }
};

function findSessionsInText(t) {
  const positions = [];
  const seen = new Set();
  for (const p of COACH_SESSION_PATTERNS) {
    if (seen.has(p.key)) continue;
    const aliasEsc = p.alias.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&').replace(/\s+/g, '\\s+');
    const re = new RegExp('\\b' + aliasEsc + '\\b', 'i');
    const m = t.match(re);
    if (m) { positions.push({ key: p.key, pos: m.index }); seen.add(p.key); }
  }
  positions.sort((a, b) => a.pos - b.pos);
  return positions.map(p => p.key);
}

function findDaysInText(t) {
  const positions = [];
  const seen = new Set();
  // Sort by alias length descending so 'tuesday' is preferred over 'tue'.
  const sorted = [...COACH_DAY_PATTERNS].sort((a, b) => b[0].length - a[0].length);
  for (const [name, dow] of sorted) {
    if (seen.has(dow)) continue;
    const re = new RegExp('\\b' + name + '\\b', 'i');
    const m = t.match(re);
    if (m) { positions.push({ dow, pos: m.index }); seen.add(dow); }
  }
  positions.sort((a, b) => a.pos - b.pos);
  return positions.map(p => p.dow);
}

function parseWeekFromText(t, currentWk) {
  const wkMatch = t.match(/(?:in\s+)?(?:wk\.?\s*|week\s+)(\d+)/i);
  if (wkMatch) return parseInt(wkMatch[1], 10);
  if (/next\s+week/i.test(t)) return currentWk + 1;
  if (/this\s+week/i.test(t)) return currentWk;
  return currentWk;
}

// Returns { intent, params } or { intent: 'unknown' } or { intent: 'help' }
function parseCoachIntent(text, currentWk) {
  const t = (text || '').toLowerCase().trim();
  if (!t) return { intent: 'empty' };
  if (/^(?:help|what can you do|examples?)\b/i.test(t)) return { intent: 'help' };

  const wk = parseWeekFromText(t, currentWk);

  // SWAP: explicit verb + two sessions
  if (/\b(?:swap|switch)\b/i.test(t)) {
    const sessions = findSessionsInText(t);
    if (sessions.length >= 2) {
      return { intent: 'SWAP_DAY', params: { sessionA: sessions[0], sessionB: sessions[1], week: wk } };
    }
  }

  // DELOAD: explicit verb. Week extraction: 'week N' wins, else 'next week', else current+1.
  if (/\bdeload\b/i.test(t)) {
    const wkMatch = t.match(/week\s+(\d+)/i);
    if (wkMatch) return { intent: 'DELOAD_NEXT', params: { week: parseInt(wkMatch[1], 10) } };
    if (/this\s+week/i.test(t)) return { intent: 'DELOAD_NEXT', params: { week: currentWk } };
    return { intent: 'DELOAD_NEXT', params: { week: currentWk + 1 } };
  }

  // HOLD_FLAT: 'hold/keep/maintain <exercise> flat [for N weeks]'
  // Also: 'keep X the same', 'no progression on X'.
  // The trailing-state group eats 'the same' / 'where it is' as a phrase so
  // the exercise group doesn't accidentally include those words.
  const holdMatch = t.match(/(?:hold|keep|maintain)\s+([a-z\s]+?)\s+(?:flat|(?:the\s+)?same|where\s+it\s+is|steady)(?:\s+for\s+(\d+)\s*weeks?)?/i)
                  || t.match(/no\s+progression\s+(?:on\s+)?([a-z\s]+?)(?:\s+for\s+(\d+)\s*weeks?)?$/i);
  if (holdMatch) {
    // Safety net: strip leftover stop-words from the exercise name.
    const cleaned = (holdMatch[1] || '').trim().replace(/\s+(?:the|my|a|an|on)$/i, '').trim();
    return {
      intent: 'HOLD_FLAT',
      params: {
        exercise: cleaned,
        weeks: holdMatch[2] ? parseInt(holdMatch[2], 10) : 1
      }
    };
  }

  // ANCHOR_GOAL: 'move/shift/change marathon to <date>' (v1.05)
  // Detected BEFORE the generic SHIFT clause so 'move marathon to oct 18'
  // doesn't accidentally fall through. Half marathon excluded — the cascade
  // handles HMs as dependents, not as the anchor.
  if (/\bmarathon\b/i.test(t) && !/\bhalf\b/i.test(t) &&
      /\b(?:move|shift|change|set|update|reschedule|moved|moving|is\s+now|on)\b/i.test(t)) {
    const dt = coachParseDate(t);
    if (dt) {
      return { intent: 'ANCHOR_GOAL', params: { milestone: 'marathon', newDate: coachDateToISO(dt) } };
    }
    // Marathon mentioned with a verb but no parseable date — surface an
    // error so the user gets a useful hint rather than 'unknown'.
    return { intent: 'ANCHOR_GOAL_NEEDS_DATE' };
  }

  // SHIFT: 'move/shift <session> to <day>' (with optional 'from <day>')
  if (/\b(?:move|shift)\b/i.test(t)) {
    const sessions = findSessionsInText(t);
    const days = findDaysInText(t);
    if (sessions.length >= 1 && days.length >= 1) {
      // If two days mentioned, second is the target; first is source (validation only).
      const toDow = days[days.length - 1];
      return {
        intent: 'SHIFT_DAY',
        params: { session: sessions[0], toDow, week: wk }
      };
    }
    if (sessions.length >= 2 && days.length === 0) {
      // 'move X and Y' with no day → treat as swap
      return { intent: 'SWAP_DAY', params: { sessionA: sessions[0], sessionB: sessions[1], week: wk } };
    }
  }

  return { intent: 'unknown' };
}

function newChangeIdForCoach() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}

function planShiftDay({ session, toDow, week }) {
  if (!session) return { error: 'I need a session name (e.g. Quality, Upper A, Legs).' };
  if (!Number.isInteger(toDow) || toDow < 0 || toDow > 6) return { error: 'I need a target day of the week.' };
  if (toDow === 0) return { error: "Sunday is your rest day — I won't schedule training on it. Pick Mon–Sat." };
  if (!WEEKS[week]) return { error: `Week ${week} isn't in the program.` };

  const schedule = getWeeklySchedule(week);
  const fromDow = schedule.indexOf(session);
  if (fromDow < 0) return { error: `${SESSION_KEY_LABEL[session]} isn't currently scheduled in Wk ${week}.` };
  if (fromDow === toDow) return { error: `${SESSION_KEY_LABEL[session]} is already on ${DOW_LABEL_FULL[toDow]} in Wk ${week}.` };

  const displaced = schedule[toDow];
  const change = {
    changeId: newChangeIdForCoach(),
    ts: new Date().toISOString(),
    sourceMsgId: null,                     // filled in by addCoachMessage
    kind: 'session_day_shift',
    week, sessionKey: session,
    payload: { fromDow, toDow },
    label: `${SESSION_KEY_LABEL[session]}: ${DOW_LABEL_FULL[fromDow]} → ${DOW_LABEL_FULL[toDow]}`,
    principleRefs: [],
    rationale: displaced
      ? `${SESSION_KEY_LABEL[displaced]} swaps back to ${DOW_LABEL_FULL[fromDow]}.`
      : `${DOW_LABEL_FULL[fromDow]} becomes a rest day.`
  };

  let msg = `Shifting ${SESSION_KEY_LABEL[session]} from ${DOW_LABEL_FULL[fromDow]} to ${DOW_LABEL_FULL[toDow]} in Wk ${week}.`;
  if (displaced) msg += ` ${SESSION_KEY_LABEL[displaced]} moves back to ${DOW_LABEL_FULL[fromDow]} so the week stays balanced.`;
  return { message: msg, changes: [change] };
}

function planSwapDay({ sessionA, sessionB, week }) {
  if (!WEEKS[week]) return { error: `Week ${week} isn't in the program.` };
  if (sessionA === sessionB) return { error: 'Those are the same session.' };
  const schedule = getWeeklySchedule(week);
  const ia = schedule.indexOf(sessionA);
  const ib = schedule.indexOf(sessionB);
  if (ia < 0) return { error: `${SESSION_KEY_LABEL[sessionA]} isn't in Wk ${week}.` };
  if (ib < 0) return { error: `${SESSION_KEY_LABEL[sessionB]} isn't in Wk ${week}.` };

  const change = {
    changeId: newChangeIdForCoach(),
    ts: new Date().toISOString(),
    sourceMsgId: null,
    kind: 'session_swap',
    week,
    payload: { sessionA, sessionB },
    label: `Swap ${SESSION_KEY_LABEL[sessionA]} (${DOW_LABEL_FULL[ia]}) ↔ ${SESSION_KEY_LABEL[sessionB]} (${DOW_LABEL_FULL[ib]})`,
    principleRefs: [],
    rationale: `${SESSION_KEY_LABEL[sessionA]} moves to ${DOW_LABEL_FULL[ib]}, ${SESSION_KEY_LABEL[sessionB]} moves to ${DOW_LABEL_FULL[ia]}.`
  };
  return {
    message: `Swapping ${SESSION_KEY_LABEL[sessionA]} (${DOW_LABEL_FULL[ia]}) and ${SESSION_KEY_LABEL[sessionB]} (${DOW_LABEL_FULL[ib]}) in Wk ${week}.`,
    changes: [change]
  };
}

function planDeloadNext({ week }) {
  if (!WEEKS[week]) return { error: `Week ${week} isn't in the program.` };
  const STRENGTH = ['upperA', 'upperB', 'lower'];
  const changes = [];
  for (const sessionKey of STRENGTH) {
    const planned = getPlanned(week, sessionKey);
    if (!planned) continue;
    const newValue = planned.replace(/@(\d+(?:\.\d+)?)\s*kg/g, (_, w) => {
      const reduced = Math.round((parseFloat(w) * 0.9) / 2.5) * 2.5;
      return `@${reduced} kg`;
    });
    if (newValue === planned) continue;
    changes.push({
      changeId: newChangeIdForCoach(),
      ts: new Date().toISOString(),
      sourceMsgId: null,
      kind: 'text_replace',
      week, sessionKey,
      payload: { oldValue: planned, newValue },
      label: `Deload ${SESSION_KEY_LABEL[sessionKey]} (Wk ${week})`,
      principleRefs: [],
      rationale: 'All kg-based weights reduced by 10%, rounded to nearest 2.5 kg.'
    });
  }
  if (changes.length === 0) return { error: `Wk ${week} has no @kg loads to reduce — looks like a run-only or bodyweight week.` };
  return {
    message: `Deload plan for Wk ${week}: cutting all strength loads by 10% (rounded to nearest 2.5 kg). Run sessions stay as planned — volume there is already low enough that you'll get more recovery from the strength cut.`,
    changes
  };
}

function planHoldFlat({ exercise, weeks }) {
  if (!exercise) return { error: 'I need an exercise: bench, squat, or deadlift.' };
  const normEx = exercise.toLowerCase().trim();
  let matched = null, matchedName = null;
  for (const [key, val] of Object.entries(COACH_HOLD_EXERCISES)) {
    if (normEx === key || normEx.includes(key) || key.includes(normEx)) {
      matched = val; matchedName = key; break;
    }
  }
  if (!matched) return { error: `I only know how to hold bench, squat, or deadlift flat right now.` };

  const currentWk = getCurrentWeek();
  const n = Math.max(1, Math.min(8, weeks || 1));

  // Read current week's prescribed weight from planned text.
  let currentWeight = null;
  for (const sk of matched.sessions) {
    const planned = getPlanned(currentWk, sk);
    if (!planned) continue;
    const line = planned.split('\n').find(l => matched.pattern.test(l));
    if (!line) continue;
    const wm = line.match(/@(\d+(?:\.\d+)?)\s*kg/);
    if (wm) { currentWeight = parseFloat(wm[1]); break; }
  }
  if (currentWeight === null) return { error: `Couldn't find a current @kg load for ${matchedName} in Wk ${currentWk}.` };

  const changes = [];
  for (let i = 1; i <= n; i++) {
    const tw = currentWk + i;
    if (!WEEKS[tw]) break;
    for (const sk of matched.sessions) {
      const planned = getPlanned(tw, sk);
      if (!planned) continue;
      const lines = planned.split('\n');
      const idx = lines.findIndex(l => matched.pattern.test(l));
      if (idx < 0) continue;
      const wm = lines[idx].match(/@(\d+(?:\.\d+)?)\s*kg/);
      if (!wm) continue;
      const pw = parseFloat(wm[1]);
      if (pw <= currentWeight) continue;
      const newLine = lines[idx].replace(`@${wm[1]} kg`, `@${currentWeight} kg`);
      const newValue = lines.map((l, j) => j === idx ? newLine : l).join('\n');
      changes.push({
        changeId: newChangeIdForCoach(),
        ts: new Date().toISOString(),
        sourceMsgId: null,
        kind: 'text_replace',
        week: tw, sessionKey: sk,
        payload: { oldValue: planned, newValue },
        label: `Hold ${matchedName} @${currentWeight} kg (Wk ${tw} ${SESSION_KEY_LABEL[sk]})`,
        principleRefs: [],
        rationale: `Was @${pw} kg → held at @${currentWeight} kg.`
      });
    }
  }
  if (changes.length === 0) return { error: `${matchedName} is already at or below ${currentWeight} kg in the next ${n} week(s).` };
  return {
    message: `Holding ${matchedName} flat at ${currentWeight} kg for the next ${n} week${n>1?'s':''}. Nothing else in those sessions changes.`,
    changes
  };
}

// ── Date parsing (v1.05) ───────────────────────────────────────────────
// Accepts: 'oct 18', 'october 18 2026', '18 oct', '18 oct 2026', '18/10',
//          '18/10/2026', '2026-10-18'. en-GB DD/MM ordering for slash dates.
function coachParseDate(text) {
  if (!text) return null;
  const s = String(text).toLowerCase();
  const thisYear = (new Date()).getFullYear();

  // ISO: 2026-10-18
  let m = s.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
  if (m) {
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }

  const MONTHS = {
    jan:0,january:0, feb:1,february:1, mar:2,march:2,
    apr:3,april:3, may:4, jun:5,june:5, jul:6,july:6,
    aug:7,august:7, sep:8,sept:8,september:8, oct:9,october:9,
    nov:10,november:10, dec:11,december:11
  };

  // "oct 18", "october 18, 2026", "oct 18th"
  m = s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?(?:[,\s]+(\d{4}))?\b/);
  if (m) {
    const month = MONTHS[m[1]];
    const day = +m[2];
    const yr = m[3] ? +m[3] : thisYear;
    const d = new Date(yr, month, day);
    return isNaN(d.getTime()) ? null : d;
  }

  // "18 oct", "18th october", "18 oct 2026"
  m = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(?:[,\s]+(\d{4}))?\b/);
  if (m) {
    const day = +m[1];
    const month = MONTHS[m[2]];
    const yr = m[3] ? +m[3] : thisYear;
    const d = new Date(yr, month, day);
    return isNaN(d.getTime()) ? null : d;
  }

  // Slash format: DD/MM or DD/MM/YYYY (en-GB)
  m = s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if (m) {
    const day = +m[1], month = +m[2];
    let yr = m[3] ? +m[3] : thisYear;
    if (yr < 100) yr += 2000;
    if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
      const d = new Date(yr, month - 1, day);
      return isNaN(d.getTime()) ? null : d;
    }
  }
  return null;
}

function coachDateToISO(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function coachDateLabel(iso) {
  // 2026-10-18 → "Sat 18 Oct 2026"
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}

// ── Milestone classifiers (v1.05) ─────────────────────────────────────
function coachIsMarathonMilestone(m) {
  if (!m || !m.label) return false;
  return /\bmarathon\b/i.test(m.label) && !/\bhalf\b/i.test(m.label);
}
function coachIsHMMilestone(m) {
  if (!m || !m.label) return false;
  return /\b(?:half\s*marathon|hm)\b/i.test(m.label);
}

// ── ANCHOR_GOAL planner ────────────────────────────────────────────────
// Returns either:
//   { error: '...' }
//   { message, changes }                     — no clarification needed
//   { message, clarifications, pendingResume } — needs HM cascade decision
function planAnchorGoal({ milestone, newDate }) {
  if (milestone !== 'marathon') {
    return { error: 'For now I can only anchor the marathon. HM / 5K / 10K anchoring is on the roadmap.' };
  }
  const ms = (state.milestones && state.milestones.length > 0) ? state.milestones : getMilestones();
  const m = ms.find(coachIsMarathonMilestone);
  if (!m) return { error: 'No marathon milestone in your goals to anchor.' };

  const oldDate = m.date;
  if (oldDate === newDate) {
    return { error: 'Marathon is already on ' + coachDateLabel(newDate) + '.' };
  }
  const dOld = new Date(oldDate);
  const dNew = new Date(newDate);
  const today = new Date(); today.setHours(0,0,0,0);
  if (dNew < today) {
    return { error: 'New marathon date is in the past — try a date after today.' };
  }
  const deltaDays = Math.round((dNew - dOld) / 86400000);
  if (Math.abs(deltaDays) > 56) {
    return { error: 'Shift is ' + Math.abs(deltaDays) + ' days (' + Math.round(Math.abs(deltaDays)/7) + ' weeks). That\'s a full program restructure — better handled by editing your milestones directly on Home.' };
  }

  const deltaStr = (deltaDays > 0 ? '+' : '') + deltaDays + ' day' + (Math.abs(deltaDays) !== 1 ? 's' : '');

  // Find HMs that the cascade should ask about.
  const hms = ms.filter(coachIsHMMilestone);

  if (hms.length === 0) {
    // No HMs → produce the plan immediately.
    const change = {
      changeId: newChangeIdForCoach(),
      ts: new Date().toISOString(),
      sourceMsgId: null,
      kind: 'goal_set',
      payload: { milestoneLabel: m.label, oldDate, newDate },
      label: `Move ${m.label}: ${coachDateLabel(oldDate)} → ${coachDateLabel(newDate)}`,
      principleRefs: [],
      rationale: `${deltaStr} from original date.`
    };
    return {
      message: `Marathon → ${coachDateLabel(newDate)} (${deltaStr}). No HMs in your milestones, so just the one change.`,
      changes: [change]
    };
  }

  // HMs present → return a clarification-message structure.
  const clarifications = hms.map((hm, i) => {
    const hmShiftedISO = coachDateToISO(new Date(new Date(hm.date).getTime() + deltaDays * 86400000));
    return {
      id: 'hm_' + i,
      milestoneLabel: hm.label,
      question: `${hm.label} (${coachDateLabel(hm.date)}):`,
      options: [
        { key: 'shift', label: `Shift ${deltaStr} → ${coachDateLabel(hmShiftedISO)}`, newDate: hmShiftedISO },
        { key: 'keep',  label: 'Keep current date',                                    newDate: hm.date }
      ],
      chosen: null
    };
  });

  return {
    message: `Marathon → ${coachDateLabel(newDate)} (${deltaStr}). Need a decision per HM before I can finalise:`,
    clarifications,
    pendingResume: {
      intentType: 'ANCHOR_GOAL',
      params: { milestoneLabel: m.label, oldDate, newDate, deltaDays }
    }
  };
}

// ── ANCHOR_GOAL resume (Confirm tapped) ────────────────────────────────
// Reads the chosen options from the clarification message and produces
// the final change list, which we post as a new coach message.
function coachResumeAnchorGoal(msgId) {
  const msg = state.coachConversation.find(x => x.id === msgId);
  if (!msg || !msg.clarifications || !msg.pendingResume) return;
  const allAnswered = msg.clarifications.every(c => c.chosen);
  if (!allAnswered) return;

  const pr = msg.pendingResume;
  const changes = [];

  // 1. The marathon date change itself
  changes.push({
    changeId: newChangeIdForCoach(),
    ts: new Date().toISOString(),
    sourceMsgId: null,
    kind: 'goal_set',
    payload: { milestoneLabel: pr.params.milestoneLabel, oldDate: pr.params.oldDate, newDate: pr.params.newDate },
    label: `Move ${pr.params.milestoneLabel}: ${coachDateLabel(pr.params.oldDate)} → ${coachDateLabel(pr.params.newDate)}`,
    principleRefs: [],
    rationale: `Anchor change, ${pr.params.deltaDays > 0 ? '+' : ''}${pr.params.deltaDays} day(s).`
  });

  // 2. One per HM clarification (only if shifted; 'keep' = no change)
  for (const c of msg.clarifications) {
    const chosenOpt = c.options.find(o => o.key === c.chosen);
    if (!chosenOpt || c.chosen === 'keep') continue;
    // Find current date for the HM (in case it's been edited since)
    const cur = (state.milestones || []).find(m => m.label === c.milestoneLabel);
    if (!cur) continue;
    if (cur.date === chosenOpt.newDate) continue;
    changes.push({
      changeId: newChangeIdForCoach(),
      ts: new Date().toISOString(),
      sourceMsgId: null,
      kind: 'goal_set',
      payload: { milestoneLabel: c.milestoneLabel, oldDate: cur.date, newDate: chosenOpt.newDate },
      label: `Move ${c.milestoneLabel}: ${coachDateLabel(cur.date)} → ${coachDateLabel(chosenOpt.newDate)}`,
      principleRefs: [],
      rationale: `Cascading from marathon shift.`
    });
  }

  // Mark the clarification message as resumed and re-render.
  msg.resumed = true;
  persistCoachConversation();

  // Build the follow-up coach reply text.
  const kept = msg.clarifications.filter(c => c.chosen === 'keep').length;
  const shifted = msg.clarifications.filter(c => c.chosen === 'shift').length;
  let txt = `Plan ready — ${changes.length} change${changes.length === 1 ? '' : 's'} to apply.`;
  if (kept > 0 && shifted > 0) txt += ` (${shifted} HM shifted, ${kept} kept on date.)`;
  else if (kept > 0)            txt += ` (${kept} HM kept on date.)`;
  else if (shifted > 0)         txt += ` (${shifted} HM shifted alongside marathon.)`;
  // Heads-up about the structural gap — informational only.
  if (Math.abs(pr.params.deltaDays) >= 7) {
    const wks = Math.round(Math.abs(pr.params.deltaDays) / 7);
    txt += `\n\nNote: this leaves a ${wks}-week gap vs the original taper. The weekly training structure isn't auto-reshaped — you may want an extra taper week. I can help with that in a follow-up request (later phase).`;
  }
  // v1.06: validate the cascade-produced changes against Crawley principles.
  attachCrawleyValidations(changes);
  addCoachMessage('coach', txt, changes);
}


// ─────────────────────────────────────────────────────────────────────
// CRAWLEY VALIDATOR (v1.06)
// ─────────────────────────────────────────────────────────────────────
// Every planner-produced change gets run through a set of validators
// derived from Fergus Crawley's hybrid-training principles. A validator
// returns either null (change is fine) or a CrawleyViolation object:
//   { principleKey, principleName, severity:'warn', message, fix?, fixDescription? }
// `fix` is an optional ProposedChange[] that addresses the violation.
// The UI surfaces violations as a warning banner on the change card;
// when fix is present, a "Show fix" button reveals the alternative.
// User can: apply original + fix, apply original only, or skip entirely.
// Warning is informational — never blocks the apply path.

const CRAWLEY_PRINCIPLES = {
  consolidate_stressors: {
    key: 'consolidate_stressors',
    name: 'Consolidate stressors',
    summary: 'Heavy lower + quality run cluster together so easy days form real recovery blocks.'
  },
  polarised_cardio_adj: {
    key: 'polarised_cardio_adj',
    name: 'Polarised cardio spacing',
    summary: 'Quality run and long run need 2+ days of separation so each gets full quality.'
  },
  deload_spacing: {
    key: 'deload_spacing',
    name: 'Deload spacing',
    summary: 'Crawley\'s 4:1 wave wants 3–4 weeks of progressive load between deloads.'
  },
  race_spacing: {
    key: 'race_spacing',
    name: 'Race spacing',
    summary: 'Key endurance races need 3+ weeks of separation for taper and recovery.'
  }
};

// Helper: compute resulting weekly schedule after applying a set of changes.
function crawleyComputeSchedule(allChanges, weekFilter) {
  const sched = [null, 'upperA', 'easy', 'lower', 'quality', 'upperB', 'longRun'];
  for (const c of allChanges) {
    if (weekFilter != null && c.week !== weekFilter) continue;
    if (c.kind === 'session_day_shift' && c.payload) {
      const { fromDow, toDow } = c.payload;
      if (Number.isInteger(fromDow) && Number.isInteger(toDow)) {
        const tmp = sched[toDow]; sched[toDow] = sched[fromDow]; sched[fromDow] = tmp;
      }
    } else if (c.kind === 'session_swap' && c.payload) {
      const { sessionA, sessionB } = c.payload;
      const ia = sched.indexOf(sessionA), ib = sched.indexOf(sessionB);
      if (ia >= 0 && ib >= 0) {
        const tmp = sched[ia]; sched[ia] = sched[ib]; sched[ib] = tmp;
      }
    }
  }
  return sched;
}

// ── Validator: consolidate_stressors ─────────────────────────────────
// Fires on schedule changes. Heavy lower and quality run should be
// within 1 day of each other. Fix proposes a secondary shift to bring
// quality back next to lower.
function crawleyValidateConsolidateStressors(change, allChanges) {
  if (change.kind !== 'session_day_shift' && change.kind !== 'session_swap') return null;
  const sched = crawleyComputeSchedule(allChanges, change.week);
  const lowerDay = sched.indexOf('lower');
  const qualityDay = sched.indexOf('quality');
  if (lowerDay < 0 || qualityDay < 0) return null;
  const distance = Math.abs(lowerDay - qualityDay);
  if (distance <= 1) return null;

  // Fix: shift quality to lowerDay ± 1 (whichever is in-week and not Sunday).
  let targetQualityDow = lowerDay + 1;
  if (targetQualityDow > 6 || targetQualityDow === 0) targetQualityDow = lowerDay - 1;
  if (targetQualityDow === qualityDay || targetQualityDow < 1 || targetQualityDow > 6) return null;

  const fix = [{
    changeId: newChangeIdForCoach(),
    ts: new Date().toISOString(),
    sourceMsgId: null,
    kind: 'session_day_shift',
    week: change.week,
    sessionKey: 'quality',
    payload: { fromDow: qualityDay, toDow: targetQualityDow },
    label: 'Re-align quality run to ' + DOW_LABEL_FULL[targetQualityDow],
    principleRefs: ['consolidate_stressors'],
    rationale: 'Brings quality run adjacent to lower so the high-stress block stays clustered.'
  }];
  return {
    principleKey: 'consolidate_stressors',
    principleName: CRAWLEY_PRINCIPLES.consolidate_stressors.name,
    severity: 'warn',
    message: 'Heavy lower (' + DOW_LABEL_FULL[lowerDay] + ') and quality run (' + DOW_LABEL_FULL[qualityDay] + ') end up ' + distance + ' days apart. Crawley\'s hybrid microcycle wants those high-stress days clustered so the rest of the week can be true recovery.',
    fix,
    fixDescription: 'Also shift quality run to ' + DOW_LABEL_FULL[targetQualityDow] + '.'
  };
}

// ── Validator: polarised_cardio_adj ──────────────────────────────────
// Fires when quality run and long run end up back-to-back. Fix moves
// quality 2+ days from long run, ideally adjacent to lower.
function crawleyValidatePolarisedCardioAdj(change, allChanges) {
  if (change.kind !== 'session_day_shift' && change.kind !== 'session_swap') return null;
  const sched = crawleyComputeSchedule(allChanges, change.week);
  const qualityDay = sched.indexOf('quality');
  const longRunDay = sched.indexOf('longRun');
  if (qualityDay < 0 || longRunDay < 0) return null;
  const distance = Math.abs(qualityDay - longRunDay);
  if (distance >= 2) return null; // good

  // Fix: move quality to a slot 2+ days from longRun, preferably next to lower
  const lowerDay = sched.indexOf('lower');
  let targetQualityDow = null;
  // Try lower+1, lower-1, then any day 2+ from longRun
  const candidates = lowerDay > 0 ? [lowerDay + 1, lowerDay - 1] : [];
  for (let d = 1; d <= 6; d++) candidates.push(d);
  for (const c of candidates) {
    if (c < 1 || c > 6) continue;
    if (c === qualityDay) continue;
    if (Math.abs(c - longRunDay) < 2) continue;
    targetQualityDow = c;
    break;
  }
  if (targetQualityDow == null) return null;

  const fix = [{
    changeId: newChangeIdForCoach(),
    ts: new Date().toISOString(),
    sourceMsgId: null,
    kind: 'session_day_shift',
    week: change.week,
    sessionKey: 'quality',
    payload: { fromDow: qualityDay, toDow: targetQualityDow },
    label: 'Move quality run to ' + DOW_LABEL_FULL[targetQualityDow] + ' (away from long run)',
    principleRefs: ['polarised_cardio_adj'],
    rationale: 'Spaces the two hard runs so neither is compromised by carryover fatigue.'
  }];
  return {
    principleKey: 'polarised_cardio_adj',
    principleName: CRAWLEY_PRINCIPLES.polarised_cardio_adj.name,
    severity: 'warn',
    message: 'Quality run (' + DOW_LABEL_FULL[qualityDay] + ') ends up back-to-back with long run (' + DOW_LABEL_FULL[longRunDay] + '). Polarised running wants those spaced so each gets its full quality.',
    fix,
    fixDescription: 'Move quality run to ' + DOW_LABEL_FULL[targetQualityDow] + ' instead.'
  };
}

// ── Validator: deload_spacing ────────────────────────────────────────
// Fires when a deload change is proposed within 3 weeks of a prior
// deload override. No automated fix — the user has to pick timing.
function crawleyValidateDeloadSpacing(change, allChanges) {
  if (change.kind !== 'text_replace') return null;
  const isDeload = /deload/i.test(change.label || '');
  if (!isDeload) return null;
  const priorDeloads = (state.programOverrides || []).filter(o =>
    o && o.kind === 'text_replace' && /deload/i.test(o.label || '') && Number.isInteger(o.week)
  );
  if (priorDeloads.length === 0) return null;
  // Each deload spans several sessions in one week; dedupe by week.
  const priorWeeks = [...new Set(priorDeloads.map(o => o.week))].sort((a, b) => b - a);
  const currentWeek = change.week;
  if (!Number.isInteger(currentWeek)) return null;
  // Find the most recent prior week that's BEFORE the current change's week.
  const lastPrior = priorWeeks.find(w => w < currentWeek);
  if (lastPrior == null) return null;
  const weeksBetween = currentWeek - lastPrior;
  if (weeksBetween >= 3) return null;

  return {
    principleKey: 'deload_spacing',
    principleName: CRAWLEY_PRINCIPLES.deload_spacing.name,
    severity: 'warn',
    message: 'You deloaded Wk ' + lastPrior + ' only ' + weeksBetween + ' week' + (weeksBetween === 1 ? '' : 's') + ' ago. Crawley\'s wave-loading pattern is 3–4 weeks of progressive load before each deload — back-to-back deloads risk losing the training stimulus.',
    fix: null,
    fixDescription: null
  };
}

// ── Validator: race_spacing ──────────────────────────────────────────
// Fires on goal_set changes. Checks the new date against all OTHER
// endurance race milestones (including any moves in the same change set,
// so cascade shifts get evaluated against their final dates).
function crawleyValidateRaceSpacing(change, allChanges) {
  if (change.kind !== 'goal_set') return null;
  if (!change.payload || !change.payload.newDate || !change.payload.milestoneLabel) return null;
  const newDate = new Date(change.payload.newDate);
  if (isNaN(newDate.getTime())) return null;

  // Build the "post-apply" date map for endurance races: start with
  // current milestones, then overlay any goal_set moves in this set.
  const planMoves = {};
  for (const c of allChanges) {
    if (c.kind === 'goal_set' && c.payload && c.payload.milestoneLabel && c.payload.newDate) {
      planMoves[c.payload.milestoneLabel] = c.payload.newDate;
    }
  }
  const milestones = state.milestones || [];
  const others = milestones.filter(m =>
    m.label !== change.payload.milestoneLabel &&
    /\b(?:half\s*marathon|hm|marathon)\b/i.test(m.label)
  );
  for (const other of others) {
    const otherDate = new Date(planMoves[other.label] || other.date);
    if (isNaN(otherDate.getTime())) continue;
    const daysBetween = Math.round(Math.abs((newDate - otherDate) / 86400000));
    if (daysBetween > 0 && daysBetween < 21) {
      return {
        principleKey: 'race_spacing',
        principleName: CRAWLEY_PRINCIPLES.race_spacing.name,
        severity: 'warn',
        message: change.payload.milestoneLabel + ' (' + coachDateLabel(change.payload.newDate) + ') is only ' + daysBetween + ' day' + (daysBetween === 1 ? '' : 's') + ' from ' + other.label + ' (' + coachDateLabel(planMoves[other.label] || other.date) + '). Crawley recommends 3+ weeks between key endurance races so each gets proper taper and recovery.',
        fix: null,
        fixDescription: null
      };
    }
  }
  return null;
}

const CRAWLEY_VALIDATORS = [
  crawleyValidateConsolidateStressors,
  crawleyValidatePolarisedCardioAdj,
  crawleyValidateDeloadSpacing,
  crawleyValidateRaceSpacing
];

function validateChangeAgainstCrawley(change, allChanges) {
  const violations = [];
  for (const v of CRAWLEY_VALIDATORS) {
    try {
      const result = v(change, allChanges);
      if (result) violations.push(result);
    } catch (e) {
      console.warn('Crawley validator error:', e);
    }
  }
  return violations;
}

// Mutates each change to add `violations` and `principleRefs` derived from
// the validator output. Idempotent: re-running yields the same violations.
function attachCrawleyValidations(changes) {
  if (!Array.isArray(changes) || changes.length === 0) return changes;
  for (const change of changes) {
    const violations = validateChangeAgainstCrawley(change, changes);
    if (violations.length > 0) {
      change.violations = violations;
      const refs = new Set(change.principleRefs || []);
      violations.forEach(v => refs.add(v.principleKey));
      change.principleRefs = Array.from(refs);
    } else {
      // Clear any stale violations from a previous run.
      if (change.violations) delete change.violations;
    }
  }
  return changes;
}

function planForIntent(parsed, currentWk) {
  let result;
  switch (parsed.intent) {
    case 'SHIFT_DAY':   result = planShiftDay(parsed.params); break;
    case 'SWAP_DAY':    result = planSwapDay(parsed.params); break;
    case 'DELOAD_NEXT': result = planDeloadNext(parsed.params); break;
    case 'HOLD_FLAT':   result = planHoldFlat(parsed.params); break;
    case 'ANCHOR_GOAL': result = planAnchorGoal(parsed.params); break;
    case 'ANCHOR_GOAL_NEEDS_DATE': return { error: 'Got "marathon" but no date — try "move marathon to oct 18" or "marathon on 2026-10-18".' };
    case 'help':        return { message: COACH_HELP_TEXT };
    case 'empty':       return { error: '' };
    default:
      return { message: "I didn't catch that. I can handle these offline:\n" + COACH_HELP_TEXT };
  }
  // v1.06: every planner-produced change set runs through Crawley validators.
  // Violations are attached to individual changes for the card UI to surface.
  if (result && Array.isArray(result.changes) && result.changes.length > 0) {
    attachCrawleyValidations(result.changes);
  }
  return result;
}
